unifi-ap-lab-rax-mount:
  date: '2026-08-17'
  tags: ['homelab', '3d-printing', 'networking']
  title:
    en: "Mounting a UniFi AP on top of my rack"
    fr: "Monter un point d’accès UniFi au-dessus de mon rack"
  excerpt:
    en: "A custom top panel gives my Lab Rax rack its own UniFi access point, angled forward instead of pointing at the ceiling."
    fr: "Un panneau du dessus sur mesure donne à mon rack Lab Rax son propre point d’accès UniFi, orienté vers l’avant plutôt que vers le plafond."
  body:
    en: 'I already have a fair number of IoT devices on my home LAN. Recently, after getting a <a href="https://busy.app/" target="_blank" rel="noopener">BUSY Bar</a>, I decided to use my homelab to isolate them from the rest of my network, mainly for security reasons. A full write-up on the BUSY Bar is <a href="../busy-bar-message-wall/">coming later</a>, but you can already send it a message from the <a href="https://khaddict.com/">homepage</a>.<br><br>So I created a dedicated VLAN for them, and since that meant getting a proper access point anyway, I deployed a UniFi OS Server as an LXC container on my Proxmox node (via the <a href="https://community-scripts.org/scripts/unifi-os-server" target="_blank" rel="noopener">community-scripts helper script</a>) to manage both the switch and the new AP from one place.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-topology.png" alt="UniFi Network topology view showing the switch, the U7 Pro and the BUSY Bar connected through it" loading="lazy" /><span class="render-caption">Topology</span></span><span class="render-item"><img src="{MEDIA}/gallery/uos-server-dashboard.png" alt="UniFi OS Server dashboard showing the LXC’s uptime and system status" loading="lazy" /><span class="render-caption">UniFi dashboard</span></span></span>I picked up a <a href="https://eu.store.ui.com/eu/en/products/u7-pro" target="_blank" rel="noopener">UniFi U7 Pro</a>, powered via PoE by the same <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> that already powers the JetKVM on the rack.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-switch-ports.png" alt="UniFi Network port table showing the U7 Pro connected over PoE alongside the rack’s other devices" loading="lazy" /><span class="render-caption">Switch ports</span></span></span>Once the AP was adopted in UniFi Network, I set up a dedicated Wi-Fi network for the IoT devices (VLAN 50), with its own SSID, broadcast only on 2.4 GHz by the U7 Pro. The BUSY Bar doesn’t need anything faster, and it keeps that traffic off the 5 and 6 GHz bands where it doesn’t need to be.<br><br>On the firewall side, that VLAN is blocked by default in every direction, including outbound internet access. IoT firmware is rarely well maintained, so I’d rather completely prevent a compromised device from contacting the outside world or joining a botnet, instead of just isolating it from the rest of my LAN. Only DNS and NTP to the firewall are allowed, with one narrow exception letting my API VM push messages to the BUSY Bar over TCP/80; nothing on that VLAN can initiate an outbound connection. For now this network mostly serves the BUSY Bar, with room for whatever else I plug into it later.<br><br>Nice side effect: Wi-Fi in my bedroom got noticeably better too, since the AP now sits a lot closer than whatever used to cover that room.<br><br>The AP worked great from day one, but I didn’t want it sitting on a shelf or screwed to a wall next to the rack. The whole point of building the Lab Rax was to have everything in one clean, self-contained unit, so the access point needed to actually be part of it rather than bolted on beside it.<br><br>The top panel already has a fan opening and side handles I wanted to keep usable. A generic wall or ceiling mount wasn’t going to cut it. I designed a replacement top panel with two integrated supports that hold the U7 Pro at roughly a 45-degree angle, facing forward into the room instead of straight up. The mounting interface itself is a separate printable adapter, screwed onto the supports with four M3 screws, so the twist-lock geometry could be printed flat instead of at an angle, which matters a lot for how cleanly that part comes out.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-render.png" alt="CAD render of the top panel supports and the separate U7 mounting adapter" loading="lazy" /><span class="render-caption">Panel and adapter, split apart</span></span></span>Printed both parts in PETG, which is basically my default for anything structural on this rack by now. Printing the adapter separately let me test the fit against the real AP before committing to final assembly.<br><br>Now the AP sits right above the rack, angled into the room.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-installed.jpg" alt="The UniFi U7 Pro mounted above the Lab Rax rack" loading="lazy" /><span class="render-caption">Mounted and running</span></span></span>Published the design on <a href="https://makerworld.com/en/models/3181762-unifi-u7-pro-45deg-mount-for-lab-rax-homelab-rack" target="_blank" rel="noopener">MakerWorld</a> if anyone else running a Lab Rax wants to do the same.
'
    fr: 'J’ai pas mal d’appareils IoT sur mon réseau LAN à la maison. Récemment, avec l’acquisition de la <a href="https://busy.app/" target="_blank" rel="noopener">BUSY Bar</a>, j’ai décidé d’utiliser mon homelab pour les isoler du reste de mon réseau, principalement pour des raisons de sécurité. Un article dédié à la BUSY Bar <a href="../busy-bar-message-wall/">arrivera plus tard</a>, mais tu peux déjà m’envoyer un message dessus depuis <a href="https://khaddict.com/fr/">l’accueil</a>.<br><br>J’ai donc créé un VLAN dédié à ces appareils, et comme ça impliquait de passer à un vrai point d’accès, j’en ai profité pour déployer un serveur UniFi OS sous forme de conteneur LXC sur mon node Proxmox (via le <a href="https://community-scripts.org/scripts/unifi-os-server" target="_blank" rel="noopener">script communautaire community-scripts</a>), pour gérer le switch et le nouveau point d’accès depuis un seul endroit.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-topology.png" alt="Vue de la topologie UniFi Network montrant le switch, le U7 Pro et la BUSY Bar connectés" loading="lazy" /><span class="render-caption">Topologie</span></span><span class="render-item"><img src="{MEDIA}/gallery/uos-server-dashboard.png" alt="Tableau de bord du serveur UniFi OS montrant l’uptime et l’état du système du LXC" loading="lazy" /><span class="render-caption">Dashboard Unifi</span></span></span>Je me suis procuré un <a href="https://eu.store.ui.com/eu/en/products/u7-pro" target="_blank" rel="noopener">UniFi U7 Pro</a>, alimenté en PoE par le même <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> qui alimente déjà le JetKVM sur le rack.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-switch-ports.png" alt="Table des ports UniFi Network montrant le U7 Pro connecté en PoE aux côtés des autres appareils du rack" loading="lazy" /><span class="render-caption">Ports du switch</span></span></span>Une fois le point d’accès adopté par UniFi OS, j’ai créé un réseau Wi-Fi dédié aux appareils IoT (VLAN 50), avec son propre SSID diffusé uniquement en 2,4 GHz par le U7 Pro. La BUSY Bar n’a besoin de rien de plus rapide, et ça évite de faire circuler ce trafic sur les bandes 5 et 6 GHz pour rien.<br><br>Côté firewall, ce VLAN est bloqué par défaut dans toutes les directions, y compris vers internet. Le firmware des objets connectés est rarement bien maintenu, donc je préfère empêcher complètement un appareil compromis de contacter l’extérieur ou de rejoindre un botnet, plutôt que de me contenter de l’isoler du reste de mon LAN. Seuls le DNS et le NTP vers le firewall sont autorisés, avec une unique exception qui permet à ma VM API d’envoyer des messages à la BUSY Bar en TCP/80 ; rien sur ce VLAN ne peut initier de connexion vers l’extérieur. Pour l’instant, ce réseau sert surtout à la BUSY Bar, avec de la place pour tout ce que j’y brancherai plus tard.<br><br>Petit bonus : le Wi-Fi de ma chambre est devenu nettement meilleur, vu que le point d’accès est désormais bien plus proche que celui qui couvrait cette pièce jusque-là.<br><br>Le point d’accès a parfaitement fonctionné dès le premier jour, mais je ne voulais pas qu’il traîne sur une étagère ou soit vissé au mur à côté du rack. Tout l’intérêt du Lab Rax était d’avoir un ensemble propre et autonome, donc le point d’accès devait vraiment en faire partie plutôt que d’être accroché à côté.<br><br>Le panneau du dessus a déjà une ouverture pour le ventilateur et des poignées que je voulais garder fonctionnelles. Un support mural ou plafond générique n’allait donc pas suffire. J’ai conçu un panneau de remplacement avec deux supports intégrés qui maintiennent le U7 Pro à environ 45 degrés, orienté vers l’avant plutôt que directement vers le plafond. L’interface de fixation elle-même est un adaptateur imprimable séparé, vissé sur les supports avec quatre vis M3, ce qui permet d’imprimer le système de verrouillage rotatif à plat plutôt qu’inclinée, ce qui fait une vraie différence sur la qualité de cette pièce.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-render.png" alt="Rendu CAO des supports du panneau et de l’adaptateur de fixation du U7" loading="lazy" /><span class="render-caption">Panneau et adaptateur, séparés</span></span></span>J’ai imprimé les deux pièces en PETG, qui est devenu mon choix par défaut pour tout ce qui est structurel sur ce rack. Imprimer l’adaptateur séparément m’a permis de tester l’ajustement avec le vrai point d’accès avant de passer à l’assemblage final.<br><br>Le point d’accès est maintenant installé juste au-dessus du rack, orienté vers la pièce.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-installed.jpg" alt="Le UniFi U7 Pro monté au-dessus du rack Lab Rax" loading="lazy" /><span class="render-caption">Installé et en fonctionnement</span></span></span>J’ai publié le modèle sur <a href="https://makerworld.com/en/models/3181762-unifi-u7-pro-45deg-mount-for-lab-rax-homelab-rack" target="_blank" rel="noopener">MakerWorld</a> si quelqu’un d’autre avec un Lab Rax veut faire pareil.'
