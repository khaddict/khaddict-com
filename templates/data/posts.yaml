first-prints-bambu-lab-p2s:
  date: '2026-07-23'
  tags: ['3d-printing']
  cover: 'bambu-lab-p2s-setup.jpg'
  title:
    en: "First prints on the Bambu Lab P2S"
    fr: "Premières impressions avec la Bambu Lab P2S"
  excerpt:
    en: "A Bambu Lab P2S, a Benchy to test it, and a handful of upgrades printed in PETG."
    fr: "Une Bambu Lab P2S, un Benchy pour la tester et quelques améliorations imprimées en PETG."
  body:
    en: 'I treated myself to a Bambu Lab P2S. I already had a long list of things to print, so as soon as it arrived, I installed <a href="https://bambulab.com/en-us/download/studio" target="_blank" rel="noopener">Bambu Studio</a> and went to have a look around <a href="https://makerworld.com/en" target="_blank" rel="noopener">MakerWorld</a>.<br><br>Unboxing and setup were both quick, and the printer looks great. It’s also much quieter than I expected, and the print speeds are pretty impressive.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/bambu-lab-p2s-setup.jpg" alt="The Bambu Lab P2S with the AMS 2 Pro loaded" loading="lazy" /><span class="render-caption">P2S with the AMS 2 Pro</span></span></span>Naturally, my first print was a <a href="https://makerworld.com/en/models/2334618-benchy-optimised-for-all-filaments?from=search#profileId-2551409" target="_blank" rel="noopener">Benchy</a>, the little boat that’s become a classic in the 3D-printing community. It’s a good way to check overhangs, bridging, and first-layer quality before starting anything more important. And when you’re just starting out, it’s practically a rite of passage.<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/p2s-benchy-timelapse.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Benchy timelapse</span></span></span>Once the Benchy came out cleanly, the next few prints were mostly about making the printer easier to use day to day, all in <span class="term" tabindex="0">PETG<span class="term-tip">PETG (Polyethylene Terephthalate Glycol): tougher and more heat-resistant than PLA, without the warping and fumes of ABS. A solid default for functional, everyday parts.</span></span>.<br><br>I ended up buying around fifteen spools. I only have one AMS 2 Pro, which holds four at a time, so the rest patiently wait their turn in their boxes.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-petg-spool-boxes.jpg" alt="A pile of PETG spool boxes in front of the P2S" loading="lazy" /><span class="render-caption">PETG spools, boxed</span></span></span>What I really wanted to print, though, was parts for my server rack and other functional pieces, and PETG is better suited for that.<br><br>I started with a <a href="https://makerworld.com/en/models/12702-bambu-scraper-grip#profileId-12703" target="_blank" rel="noopener">scraper</a>, one of the most-downloaded models. The blade and screws are included with the P2S, so only the handle needed printing. It cleanly pops prints off the bed. I also printed a <a href="https://makerworld.com/en/models/1603348-p1s-p2s-x2d-poop-bin?from=search#profileId-2973685" target="_blank" rel="noopener">poop bin</a> (yes, that’s genuinely its name), which catches the filament the printer purges between prints or after a color change.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-prints-batch-one.jpg" alt="The Benchy, scraper and poop bin" loading="lazy" /><span class="render-caption">Benchy, scraper, poop bin</span></span></span>I also printed an <a href="https://makerworld.com/en/models/1926190-p2s-and-x2d-auxiliary-fan-diffuser" target="_blank" rel="noopener">auxiliary fan diffuser</a> to help reduce warping, along with a set of <a href="https://makerworld.com/en/models/1893614-p2s-x2d-dustcover-for-the-holes-on-the-bottom" target="_blank" rel="noopener">dust covers for the holes on the bottom</a>.<br><br>Five prints so far, all of them successful. Mostly upgrades rather than actual projects, but that seems pretty normal when you’re starting out with a new printer: you begin by printing accessories so you can then print... more accessories.<br><br>An under-printer storage unit is already underway, and a riser for the AMS 2 Pro is next on the list. After that comes the first proper big project: the rack that will hold my homelab. I’ve already ordered a <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> powered over PoE, which also led me to replace my switch with a <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>.<br><br>In other words, buying a 3D printer was obviously the start of a series of perfectly reasonable expenses. 😇'
    fr: 'Je me suis offert une Bambu Lab P2S. J’avais déjà une longue liste de choses à imprimer, donc dès qu’elle est arrivée, j’ai installé <a href="https://bambulab.com/fr-fr/download/studio" target="_blank" rel="noopener">Bambu Studio</a> et je suis allé faire un tour sur <a href="https://makerworld.com/fr" target="_blank" rel="noopener">MakerWorld</a>.<br><br>Le déballage et l’installation ont été rapides, et l’imprimante est vraiment belle. Elle est aussi beaucoup plus silencieuse que je ne l’imaginais, et les vitesses d’impression sont assez impressionnantes.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/bambu-lab-p2s-setup.jpg" alt="La Bambu Lab P2S avec l’AMS 2 Pro chargé" loading="lazy" /><span class="render-caption">P2S avec l’AMS 2 Pro</span></span></span>Évidemment, ma première impression a été un <a href="https://makerworld.com/en/models/2334618-benchy-optimised-for-all-filaments?from=search#profileId-2551409" target="_blank" rel="noopener">Benchy</a>, le petit bateau devenu un grand classique dans la communauté de l’impression 3D. C’est un bon moyen de vérifier les porte-à-faux, les ponts et la qualité de la première couche avant de lancer quelque chose de plus important. Et puis, quand on débute, c’est presque un passage obligé.<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/p2s-benchy-timelapse.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Timelapse du Benchy</span></span></span>Une fois le Benchy sorti proprement, les impressions suivantes ont surtout servi à rendre l’imprimante plus pratique au quotidien, toutes en <span class="term" tabindex="0">PETG<span class="term-tip">PETG (polyéthylène téréphtalate glycolisé) : plus résistant et plus tolérant à la chaleur que le PLA, sans le gauchissement ni les émanations de l’ABS. Un bon choix par défaut pour des pièces fonctionnelles du quotidien.</span></span>.<br><br>J’ai fini par acheter une quinzaine de bobines. Je n’ai qu’un seul AMS 2 Pro, qui n’en accueille que quatre à la fois, donc les autres attendent sagement leur tour dans leurs cartons.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-petg-spool-boxes.jpg" alt="Une pile de cartons de bobines PETG devant la P2S" loading="lazy" /><span class="render-caption">Bobines de PETG, en carton</span></span></span>Ce que je voulais surtout imprimer, c’était des pièces pour mon rack serveur et d’autres objets fonctionnels, pour lesquels le PETG est mieux adapté.<br><br>J’ai commencé par une <a href="https://makerworld.com/en/models/12702-bambu-scraper-grip#profileId-12703" target="_blank" rel="noopener">raclette</a>, l’un des modèles les plus téléchargés. La lame et les vis sont fournies avec la P2S, il ne restait donc que la poignée à imprimer. Elle permet de retirer proprement les impressions du plateau. J’ai aussi imprimé une <a href="https://makerworld.com/en/models/1603348-p1s-p2s-x2d-poop-bin?from=search#profileId-2973685" target="_blank" rel="noopener">corbeille à caca</a> (oui, c’est vraiment son nom), qui récupère le filament purgé entre deux impressions ou après un changement de couleur.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-prints-batch-one.jpg" alt="Le Benchy, la raclette et la corbeille à caca" loading="lazy" /><span class="render-caption">Benchy, raclette, corbeille à caca</span></span></span>J’ai également imprimé un <a href="https://makerworld.com/en/models/1926190-p2s-and-x2d-auxiliary-fan-diffuser" target="_blank" rel="noopener">diffuseur de ventilateur auxiliaire</a> pour limiter le gauchissement, ainsi que des <a href="https://makerworld.com/en/models/1893614-p2s-x2d-dustcover-for-the-holes-on-the-bottom" target="_blank" rel="noopener">caches pour les ouvertures sous l’imprimante</a>.<br><br>Cinq impressions pour l’instant, toutes réussies. Ce sont surtout des améliorations plutôt que de vrais projets, mais j’ai l’impression que c’est assez classique quand on débute avec une nouvelle imprimante : on commence par imprimer des accessoires pour pouvoir ensuite imprimer... d’autres accessoires.<br><br>Un rangement sous l’imprimante est déjà en cours, et un rehausseur pour l’AMS 2 Pro est le suivant sur la liste. Après ça viendra le premier vrai gros projet : le rack qui accueillera mon homelab. J’ai déjà commandé un <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> alimenté en PoE, ce qui m’a aussi poussé à remplacer mon switch par un <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>.<br><br>Autrement dit, acheter une imprimante 3D était évidemment le début d’une série de dépenses parfaitement raisonnables. 😇'

the-lab-rax:
  date: '2026-08-04'
  tags: ['homelab', '3d-printing']
  cover: 'lab-rax-front-night.jpg'
  title:
    en: "Printing a rack for my homelab"
    fr: "Imprimer un rack pour mon homelab"
  excerpt:
    en: "My homelab finally has a proper 3D-printed rack, with custom trays for its hardware."
    fr: "Mon homelab a enfin un vrai rack imprimé en 3D, avec des tiroirs personnalisés pour son matériel."
  body:
    en: 'My homelab has never been particularly organized: hardware scattered around, cables everywhere, nothing really secured in place. Recently, I decided it was time for a proper rack, and the <a href="https://makerworld.com/en/collections/5813742-lab-rax" target="_blank" rel="noopener">Lab Rax</a> project was exactly what I needed. In the end, the rack itself was the easy part. Finding trays that actually fit my GEEKOM A9 Max mini PC or my Raspberry Pi 5 in its FLIRC case was much harder: nothing ready-made really worked for either of them.<br><br>It is a 10-inch Lab Rax, which explains the format of every printed tray that follows. Here are a few videos of the frame being printed:<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/lab-rax-corner-edges.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Corner pieces</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-top-front-edge.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Top front edge</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-bottom-front-edge-handle.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bottom front edge and handles</span></span></span> One of the side panels came out warped after I pulled it off the bed while it was still too hot (a bad idea), so it had to be reprinted.<br><br>Since nothing off the shelf fit, I designed and printed my own trays and published them on <a href="https://makerworld.com/en/@khaddict/upload" target="_blank" rel="noopener">MakerWorld</a>: a <a href="https://makerworld.com/en/models/3122060-geekom-a9-max-4-3u-mini-pc-tray-for-10-rack#profileId-3522107" target="_blank" rel="noopener">4/3U tray for the GEEKOM A9 Max</a> and a <a href="https://makerworld.com/en/models/3120554-1u-10-rack-tray-for-raspberry-pi-5-in-flirc-case#profileId-3520277" target="_blank" rel="noopener">1U tray for the Raspberry Pi 5 in its FLIRC case</a>, both printed in PETG.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-pi5-tray-render.png" alt="The Raspberry Pi 5 tray, as designed" loading="lazy" /><span class="render-caption">Raspberry Pi 5 tray</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-geekom-tray-render.png" alt="The GEEKOM A9 Max tray, as designed" loading="lazy" /><span class="render-caption">GEEKOM A9 Max tray</span></span></span>On the hardware side, the whole point of a KVM is being able to access a node’s console even when its network connection is down. A <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> is now mounted directly on the rack, connected to its own switch port and powered entirely over PoE. That single requirement is also why the old switch is gone, replaced with a <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>, which powers it directly.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-day.jpg" alt="The JetKVM and the Ubiquiti PoE switch mounted on the rack" loading="lazy" /><span class="render-caption">By day</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-night.jpg" alt="The same view at night, with the RGB fan lit up" loading="lazy" /><span class="render-caption">By night</span></span></span>The rack finally feels like a proper setup, and I love it. An RGB fan handles cooling, and a 1U power strip lets me plug everything in neatly. Cables are still cables, but at least they are now routed behind a <a href="https://makerworld.com/en/models/3120435-1u-brush-cable-management-panel-for-lab-rax-10#profileId-3520062" target="_blank" rel="noopener">brush panel</a> and kept inside the rack. The brush panel started out as one I bought on Amazon, but to keep the color scheme consistent, I ended up redesigning it and printing my own version. 😎<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-brush-panel.jpg" alt="The brush cable panel and fan mount, installed" loading="lazy" /><span class="render-caption">Brush panel</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-cable-management.jpg" alt="Power and cabling routed through the back of the rack" loading="lazy" /><span class="render-caption">Cable routing</span></span></span>'
    fr: 'Mon homelab n’a jamais été particulièrement organisé : du matériel éparpillé partout, des câbles dans tous les sens, rien de vraiment fixé. Récemment, j’ai décidé qu’il était temps de passer à un vrai rack, et le projet <a href="https://makerworld.com/fr/collections/5813742-lab-rax" target="_blank" rel="noopener">Lab Rax</a> correspondait exactement à ce qu’il me fallait. Au final, le rack lui-même a été la partie la plus simple. Trouver des plateaux adaptés au format rack pour mon mini PC GEEKOM A9 Max ou mon Raspberry Pi 5 dans son boîtier FLIRC l’était beaucoup moins : rien de prêt à l’emploi ne convenait vraiment à l’un ou à l’autre.<br><br>C’est un Lab Rax 10 pouces, ce qui explique le format de tous les plateaux imprimés qui suivent. Voici quelques vidéos de l’impression de la structure :<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/lab-rax-corner-edges.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Pièces d’angle</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-top-front-edge.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bord supérieur avant</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-bottom-front-edge-handle.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bord inférieur avant et poignées</span></span></span> L’un des panneaux latéraux s’est déformé parce que je l’ai retiré du plateau alors qu’il était encore trop chaud (mauvaise idée), donc il a fallu le réimprimer.<br><br>Comme rien de prêt à l’emploi ne convenait, j’ai conçu et imprimé mes propres plateaux, puis je les ai publiés sur <a href="https://makerworld.com/en/@khaddict/upload" target="_blank" rel="noopener">MakerWorld</a> : un <a href="https://makerworld.com/en/models/3122060-geekom-a9-max-4-3u-mini-pc-tray-for-10-rack#profileId-3522107" target="_blank" rel="noopener">plateau 4/3U pour le GEEKOM A9 Max</a> et un <a href="https://makerworld.com/en/models/3120554-1u-10-rack-tray-for-raspberry-pi-5-in-flirc-case#profileId-3520277" target="_blank" rel="noopener">plateau 1U pour le Raspberry Pi 5 dans son boîtier FLIRC</a>, tous les deux imprimés en PETG.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-pi5-tray-render.png" alt="Le plateau Raspberry Pi 5, tel que conçu" loading="lazy" /><span class="render-caption">Plateau Raspberry Pi 5</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-geekom-tray-render.png" alt="Le plateau GEEKOM A9 Max, tel que conçu" loading="lazy" /><span class="render-caption">Plateau GEEKOM A9 Max</span></span></span>Côté matériel, tout l’intérêt d’un KVM est de pouvoir accéder à la console d’un node même si sa connexion réseau tombe. Un <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> est donc maintenant installé directement sur le rack, connecté à son propre port du switch et entièrement alimenté en PoE. C’est d’ailleurs cette contrainte qui m’a fait remplacer l’ancien switch par un <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>, qui l’alimente directement.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-day.jpg" alt="Le JetKVM et le switch PoE Ubiquiti montés sur le rack" loading="lazy" /><span class="render-caption">De jour</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-night.jpg" alt="La même vue de nuit, avec le ventilateur RGB allumé" loading="lazy" /><span class="render-caption">De nuit</span></span></span>Le rack a enfin l’air d’un vrai setup, et j’en suis ravi. Un ventilateur RGB se charge du refroidissement, et une multiprise 1U permet de brancher proprement tous les équipements du rack. Les câbles restent des câbles, mais au moins ils sont maintenant routés derrière un <a href="https://makerworld.com/en/models/3120435-1u-brush-cable-management-panel-for-lab-rax-10#profileId-3520062" target="_blank" rel="noopener">panneau à brosse</a> et restent contenus à l’intérieur du rack. À l’origine, j’avais acheté ce panneau sur Amazon, mais pour garder une couleur uniforme sur l’ensemble du rack, j’ai fini par le redessiner et en imprimer ma propre version. 😎<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-brush-panel.jpg" alt="Le panneau à brosse et le support de ventilateur, installés" loading="lazy" /><span class="render-caption">Panneau à brosse</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-cable-management.jpg" alt="Alimentation et câblage routés à l’arrière du rack" loading="lazy" /><span class="render-caption">Câblage arrière</span></span></span>'

more-prints-for-the-p2s:
  date: '2026-08-13'
  tags: ['3d-printing']
  cover: 'p2s-under-printer-storage-installed.jpg'
  title:
    en: "A few more prints for the P2S"
    fr: "Encore quelques impressions pour la P2S"
  excerpt:
    en: "A Gridfinity storage box, an under-printer storage unit, and a riser to place the AMS 2 Pro above the P2S."
    fr: "Une boîte de rangement Gridfinity, un rangement sous l’imprimante et un rehausseur pour poser l’AMS 2 Pro au-dessus de la P2S."
  body:
    en: 'A few weeks after my first post about the P2S, the two prints I mentioned last time are now finished, plus a third one I hadn’t originally planned.<br><br>First, a <a href="https://makerworld.com/en/models/1635998-storage-box-gridfinity#profileId-1728274" target="_blank" rel="noopener">Gridfinity storage box</a>. I bought a bunch of screws and nuts for the Lab Rax and got annoyed at having open bags of them lying around in my toolbox. Each compartment is labeled as part of the print (screws, nuts, magnets, and one for whatever does not fit anywhere else), and I also customized the front label with my own design instead of leaving it plain.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-open.jpg" alt="The Gridfinity storage box, open and filled with hardware" loading="lazy" /><span class="render-caption">Compartments, labeled</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-closed.jpg" alt="The Gridfinity storage box, closed, with a custom label" loading="lazy" /><span class="render-caption">Custom label</span></span></span>Next was the <a href="https://makerworld.com/en/models/1347731-x2d-x1-p2s-p1s-poop-chute-under-printer-storage#profileId-1389787" target="_blank" rel="noopener">under-printer storage</a> I mentioned last time, which also includes a chute that routes purge waste straight down. I had already printed a poop bin, but this setup is basically an upgrade: I still need to print a small bin that slots into the storage unit. The main benefit is the two drawers underneath. Instead of setting the printer directly on the floor, it now sits raised on a proper little storage unit.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage.jpg" alt="The under-printer storage unit, before mounting" loading="lazy" /><span class="render-caption">Before mounting</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage-installed.jpg" alt="The under-printer storage unit, installed, with a drawer open" loading="lazy" /><span class="render-caption">Installed, drawer open</span></span></span>Last up is the <a href="https://makerworld.com/en/models/2682036-x2d-p2s-riser-ams-flipper-v2#profileId-2970491" target="_blank" rel="noopener">AMS riser</a>, which raises the AMS 2 Pro while still letting me see the print from above.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-lifted.jpg" alt="The AMS 2 Pro, lifted up on the riser" loading="lazy" /><span class="render-caption">Lifted up</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-set-down.jpg" alt="The AMS 2 Pro set back down on the riser, on top of the printer" loading="lazy" /><span class="render-caption">Set down</span></span></span>Three more prints, and the P2S is slowly starting to find its place in the room. 😊'
    fr: 'Quelques semaines après mon premier article sur la P2S, les deux impressions que j’avais annoncées sont maintenant terminées, avec en plus une troisième que je n’avais pas prévue au départ.<br><br>D’abord, une <a href="https://makerworld.com/en/models/1635998-storage-box-gridfinity#profileId-1728274" target="_blank" rel="noopener">boîte de rangement Gridfinity</a>. J’ai acheté pas mal de vis et d’écrous pour le Lab Rax et j’en ai eu marre des sachets ouverts qui traînaient dans ma caisse à outils. Chaque compartiment est étiqueté directement lors de l’impression (vis, écrous, aimants et un pour tout ce qui ne rentre nulle part ailleurs), et j’ai aussi personnalisé l’étiquette de façade avec mon propre visuel au lieu de la laisser neutre.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-open.jpg" alt="La boîte de rangement Gridfinity, ouverte et remplie de quincaillerie" loading="lazy" /><span class="render-caption">Compartiments étiquetés</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-closed.jpg" alt="La boîte de rangement Gridfinity, fermée, avec une étiquette personnalisée" loading="lazy" /><span class="render-caption">Étiquette personnalisée</span></span></span>Ensuite, je me suis occupé du <a href="https://makerworld.com/en/models/1347731-x2d-x1-p2s-p1s-poop-chute-under-printer-storage#profileId-1389787" target="_blank" rel="noopener">rangement sous l’imprimante</a> mentionné la dernière fois, qui intègre aussi une goulotte pour évacuer les résidus de purge directement vers le bas. J’avais déjà imprimé une corbeille à caca, mais ce système est en quelque sorte une version améliorée : il me reste simplement à imprimer un petit bac à glisser dans le rangement. L’intérêt principal, ce sont les deux tiroirs en dessous. Plutôt que de poser l’imprimante directement au sol, elle repose maintenant, surélevée, sur un vrai petit meuble de rangement.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage.jpg" alt="Le rangement sous l’imprimante, avant montage" loading="lazy" /><span class="render-caption">Avant montage</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage-installed.jpg" alt="Le rangement sous l’imprimante, installé, avec un tiroir ouvert" loading="lazy" /><span class="render-caption">Installé, tiroir ouvert</span></span></span>Dernier ajout : le <a href="https://makerworld.com/en/models/2682036-x2d-p2s-riser-ams-flipper-v2#profileId-2970491" target="_blank" rel="noopener">rehausseur d’AMS</a>, qui surélève l’AMS 2 Pro tout en gardant une vue sur l’impression par le dessus.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-lifted.jpg" alt="L’AMS 2 Pro, relevé sur le rehausseur" loading="lazy" /><span class="render-caption">Relevé</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-set-down.jpg" alt="L’AMS 2 Pro reposé sur le rehausseur, au-dessus de l’imprimante" loading="lazy" /><span class="render-caption">Posé</span></span></span>Trois impressions de plus, et la P2S commence doucement à trouver sa place dans la pièce. 😊'

busy-bar-message-wall:
  date: '2026-09-03'
  tags: ['homelab', 'dev', 'systems']
  cover: 'busy-bar-unboxing.jpg'
  title:
    en: "Turning my BUSY Bar into a public message wall"
    fr: "Transformer ma BUSY Bar en mur de messages public"
  excerpt:
    en: "Visitors can now send messages or images straight to an LED bar sitting on my desk, live from the site."
    fr: "Les visiteurs peuvent maintenant envoyer des messages ou des images directement sur une barre LED posée sur mon bureau, en direct depuis le site."
  body:
    en: 'A few months ago, I came across a project by <a href="https://aschmelyun.com/blog/i-invited-strangers-to-message-me-through-a-receipt-printer/" target="_blank" rel="noopener">Andrew Schmelyun</a>: a web page where anyone can send an anonymous message that gets printed on a real receipt printer sitting on his desk. I thought it was brilliant. Completely disproportionate for the problem it solved, so of course it stuck with me, until I came across the <a href="https://busy.app/" target="_blank" rel="noopener">BUSY Bar</a>. Flipper makes it, which immediately caught my attention. I’ve owned a Flipper Zero and I really like their approach: things that look like gadgets at first, but get a lot more interesting once you start looking at what you can hack together with them. At first, I had a much more reasonable idea: show my homelab monitoring on it. Naturally, that got slightly out of hand.<br><br>The BUSY Bar is a small 72×16 pixel LED matrix, with a built-in speaker that also lets it play a few seconds of audio. Out of the box, it runs a handful of apps like a clock, a timer, or the weather, controlled with a knob and a couple of buttons.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-unboxing.jpg" alt="Unboxing the BUSY Bar" loading="lazy" /><span class="render-caption">Unboxing</span></span><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-back-panel.jpg" alt="The back of the BUSY Bar, showing its knob and buttons" loading="lazy" /><span class="render-caption">Back panel</span></span></span>Its firmware is open source and uses the same build tool as the Flipper Zero, <span class="term" tabindex="0">fbt<span class="term-tip">fbt (Flipper Build Tool): Flipper Devices’ in-house build tool, based on SCons, used to compile the Flipper Zero’s firmware and apps.</span></span>.<br><br><h2 class="section-title">Talking to the bar</h2>What interested me most, though, was its <a href="https://docs.busy.app/bar/dev" target="_blank" rel="noopener">HTTP API</a>: no need to touch the firmware, you just send requests to the bar asking it to display text or images. A call describes an application, a priority between 0 and 100, and a list of elements to draw on the grid: text, image, position, color, font, display duration. Images can also be sent to the bar once and reused afterward by filename. That was more than enough to start experimenting.<br><br>Rather than talk to the BUSY Bar directly from my site, I put a small FastAPI service in front of it. It runs on <a href="https://api.khaddict.com" target="_blank" rel="noopener">api.khaddict.com</a>, as a single Gunicorn worker. That’s deliberate: the rate limiter and job queue live in memory, so having several independent processes would make things unnecessarily complicated. The service then talks to the BUSY Bar over its own isolated IoT VLAN. I already covered that part in <a href="../unifi-ap-lab-rax-mount/">my access point write-up</a>. On top of the official API, I added a handful of endpoints for receiving messages, images and audio clips, pulling a mirror of the screen, and a few admin functions. Alertmanager also gets its own endpoint, <code>/wall/alert</code>, protected by a token.<br><br><h2 class="section-title">Internet on my desk</h2>On my site’s homepage, I added a small widget that lets anyone send a message, an image, or a short audio clip. A moment later, the content actually shows up on the bar sitting on my desk. Whoever sends the message sees it appear live on the BUSY Bar preview embedded in the page, which mirrors what’s actually shown on the real thing. On the server side, every submission goes through a single asyncio queue. Without it, two visitors could submit something at the same time and their display sequences could end up getting mixed together. I also added a per-IP rate limit and a daily cap of a few hundred messages. I don’t expect hundreds of people fighting to write on my BUSY Bar, but it seemed worth keeping a simple script from spamming it.<br><br><h2 class="section-title">The priority problem</h2>One detail of the BUSY Bar’s API ended up mattering a lot more than expected: the priority attached to each draw call. Whichever app holds the highest priority keeps the screen. If another app tries to display something at a lower priority, the bar just returns a 409 error.<br><br>I didn’t pay it much attention at first, until I added a clock that redrew itself every second. The bar’s native apps sit around a priority of 10. An active work session can go up to 90. The device’s “off” state is 0. My first clock had too high a priority. The result: I’d press a button to open a native app, it would show up, then a second later my clock would take the screen back. So I settled on a priority of 5: anything between 1 and 9 would have worked, as long as it stays above 0 (the off state) and below 10 (the native apps). And whenever a clock draw gets a 409, I just ignore it. It just means something more important is currently on screen.<br><br>Between messages, the bar wasn’t doing much, so I built a small clock of my own: a pixel-art logo on the left, the date in magenta and the time in cyan.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-clock.png" alt="The clock displayed on the BUSY Bar" loading="lazy" /><span class="render-caption">The clock</span></span></span>It redraws every second so the seconds actually tick. It mostly works as a clock on my desk. Between midnight and 9am, a script automatically drops the brightness and volume to zero so it doesn’t bother me while I sleep. At 9am, both go back up to 100%.<br><br><h2 class="section-title">And while I’m at it, monitoring</h2>Prometheus and Alertmanager already send me infrastructure alerts on Discord. Now, warning and critical alerts are also routed to the BUSY Bar via <code>/wall/alert</code>. The endpoint is protected by a token, compared in constant time on the backend. That obviously doesn’t replace Discord or the rest of my alerting setup, but I like the idea that a serious problem can literally show up on my desk.<br><br>Hard to miss a screen changing color thirty centimeters away.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-alert-firing.png" alt="A critical alert displayed on the BUSY Bar" loading="lazy" /><span class="render-caption">Alert firing</span></span><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-alert-resolved.png" alt="The same alert once resolved, shown in green" loading="lazy" /><span class="render-caption">Alert resolved</span></span></span>Since then, I’ve reused the same principle for my backups. StackStorm triggers snapshots of my core VMs and LXC containers every night, then pushes a summary to the BUSY Bar through a new endpoint, <code>/wall/report</code>: the number of successful and failed snapshots, in green if everything went fine and red otherwise.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-snapshot-report.png" alt="The StackStorm snapshot summary displayed on the BUSY Bar" loading="lazy" /><span class="render-caption">Snapshot summary</span></span></span>Authentication works the same way as for Alertmanager, with a separate secret on the StackStorm side.<br><br>What I like most about this project is that it didn’t need any new hardware or custom firmware in the end. The BUSY Bar already had almost everything it needed. I just added a small layer between its API and the internet. Flipper’s roadmap mentions proper installable apps at some point, which would probably make some of this cleaner. But for now, the HTTP API already goes surprisingly far.<br><br>A completely useless project, therefore absolutely essential. 😁'
    fr: 'Il y a quelques mois, je suis tombé sur un projet d’<a href="https://aschmelyun.com/blog/i-invited-strangers-to-message-me-through-a-receipt-printer/" target="_blank" rel="noopener">Andrew Schmelyun</a> : une page web où n’importe qui peut envoyer un message anonyme, qui est ensuite imprimé sur une vraie imprimante à tickets posée sur son bureau. J’avais trouvé ça génial. Complètement disproportionné pour le problème résolu, donc évidemment ça m’est resté en tête, jusqu’à ce que je tombe sur la <a href="https://busy.app/" target="_blank" rel="noopener">BUSY Bar</a>. C’est Flipper qui la fabrique, ce qui a immédiatement attiré mon attention. J’ai déjà eu un Flipper Zero et j’aime beaucoup leur approche : des objets qui ressemblent d’abord à des gadgets, mais qui deviennent beaucoup plus intéressants dès qu’on commence à regarder ce qu’on peut bricoler avec. Au départ, j’avais une idée beaucoup plus raisonnable : afficher le monitoring de mon homelab dessus. Évidemment, ça a légèrement dérapé.<br><br>La BUSY Bar est une petite matrice LED de 72×16 pixels, avec un petit haut-parleur intégré qui permet aussi de lire quelques secondes d’audio. De base, elle embarque quelques applications comme une horloge, un minuteur ou la météo, contrôlées avec une molette et quelques boutons.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-unboxing.jpg" alt="Déballage de la BUSY Bar" loading="lazy" /><span class="render-caption">Déballage</span></span><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-back-panel.jpg" alt="L’arrière de la BUSY Bar, avec sa molette et ses boutons" loading="lazy" /><span class="render-caption">Panneau arrière</span></span></span>Son firmware est open source et utilise le même outil de build que le Flipper Zero, <span class="term" tabindex="0">fbt<span class="term-tip">fbt (Flipper Build Tool) : l’outil de build maison de Flipper Devices, basé sur SCons, utilisé pour compiler le firmware et les apps du Flipper Zero.</span></span>.<br><br><h2 class="section-title">Parler à la barre</h2>Mais ce qui m’intéressait surtout, c’était son <a href="https://docs.busy.app/bar/dev" target="_blank" rel="noopener">API HTTP</a> : pas besoin de modifier le firmware, il suffit d’envoyer des requêtes à la barre pour lui demander d’afficher du texte ou des images. Un appel décrit une application, une priorité entre 0 et 100, et une liste d’éléments à afficher sur la grille : texte, image, position, couleur, police, durée d’affichage. Les images peuvent également être envoyées une fois sur la barre puis réutilisées par leur nom de fichier. Ça suffisait largement pour commencer à expérimenter.<br><br>Plutôt que de parler directement à la BUSY Bar depuis mon site, j’ai mis un petit service FastAPI devant. Il tourne sur <a href="https://api.khaddict.com">api.khaddict.com</a>, avec un seul worker Gunicorn. C’est volontaire : le rate limiting et la file de tâches sont en mémoire, donc plusieurs processus indépendants compliqueraient inutilement les choses. Le service communique ensuite avec la BUSY Bar sur son propre VLAN IoT isolé. J’avais déjà détaillé cette partie dans <a href="../unifi-ap-lab-rax-mount/">mon article sur le point d’accès</a>. Par-dessus l’API officielle, j’ai ajouté quelques endpoints pour recevoir les messages, images et extraits audio, récupérer un miroir de l’écran et exposer quelques fonctions d’administration. Alertmanager dispose également de son propre endpoint, <code>/wall/alert</code>, protégé par token.<br><br><h2 class="section-title">Internet sur mon bureau</h2>Sur la page d’accueil de mon site, j’ai ajouté un petit widget qui permet d’envoyer un message, une image ou un court extrait audio. Quelques instants plus tard, le contenu arrive réellement sur la barre posée sur mon bureau. La personne qui envoie le message le voit s’afficher en direct sur le rendu de la BUSY Bar intégré à la page, qui reflète ce qui est réellement affiché sur la barre. Côté serveur, tous les envois passent dans une file asyncio unique. Sans ça, deux visiteurs pourraient envoyer quelque chose au même moment et leurs séquences d’affichage risqueraient de se mélanger. J’ai aussi ajouté un rate limit par IP et une limite globale de quelques centaines de messages par jour. Je ne m’attends pas spécialement à avoir des centaines de personnes qui se battent pour écrire sur ma BUSY Bar, mais autant éviter qu’un simple script puisse la spammer.<br><br><h2 class="section-title">Le problème des priorités</h2>Un détail de l’API de la BUSY Bar a fini par devenir beaucoup plus important que prévu : la priorité associée à chaque appel. L’application avec la priorité la plus élevée garde l’écran. Si une autre application essaie d’afficher quelque chose avec une priorité plus faible, la barre renvoie simplement une erreur 409.<br><br>Au début, je n’y avais pas prêté énormément attention, jusqu’à ce que j’ajoute une horloge qui se redessinait toutes les secondes. Les applications natives de la barre tournent autour d’une priorité de 10. Une session de travail active peut monter à 90. L’état « off » de l’appareil est à 0. Ma première horloge avait une priorité trop élevée. Résultat : j’appuyais sur un bouton pour ouvrir une application native, elle apparaissait, puis une seconde plus tard mon horloge reprenait l’écran. J’ai donc mis en place une priorité de 5 : n’importe quelle valeur entre 1 et 9 aurait fonctionné, tant qu’elle reste supérieure à 0 (l’état off) et inférieure à 10 (les applications natives). Et lorsqu’un appel de l’horloge reçoit un 409, je l’ignore simplement. Ça veut juste dire que quelque chose de plus important est actuellement affiché.<br><br>Entre deux messages, la barre ne faisait pas grand-chose. J’ai donc fabriqué une petite horloge maison : logo en pixel art à gauche, date en magenta et heure en cyan.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-clock.png" alt="L’horloge affichée sur la BUSY Bar" loading="lazy" /><span class="render-caption">L’horloge</span></span></span>Elle est redessinée chaque seconde pour afficher les secondes en temps réel. Elle me sert surtout d’horloge sur mon bureau. Entre minuit et 9h, un script règle automatiquement la luminosité et le volume à zéro pour que ça ne me dérange pas lorsque je dors. À 9h, les deux remontent à 100 %.<br><br><h2 class="section-title">Et tant qu’à faire, le monitoring</h2>Prometheus et Alertmanager m’envoient déjà les alertes de mon infrastructure sur Discord. Maintenant, les alertes warning et critical sont aussi routées vers la BUSY Bar via <code>/wall/alert</code>. L’endpoint est protégé par un token, vérifié en temps constant côté backend. Ça ne remplace évidemment pas Discord ou le reste de mon système d’alerting, mais j’aime bien l’idée qu’un problème important puisse littéralement apparaître sur mon bureau.<br><br>Difficile de rater un écran qui change de couleur à trente centimètres de soi.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-alert-firing.png" alt="Une alerte critique affichée sur la BUSY Bar" loading="lazy" /><span class="render-caption">Alerte en cours</span></span><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-alert-resolved.png" alt="La même alerte une fois résolue, affichée en vert" loading="lazy" /><span class="render-caption">Alerte résolue</span></span></span>Depuis, j’ai réutilisé le même principe pour mes sauvegardes. StackStorm déclenche chaque nuit les snapshots de mes VMs et conteneurs LXC principaux, puis pousse un résumé sur la BUSY Bar via un nouvel endpoint, <code>/wall/report</code> : le nombre de snapshots réussis et échoués, en vert si tout s’est bien passé et en rouge sinon.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/busy-bar-snapshot-report.png" alt="Le résumé des snapshots StackStorm affiché sur la BUSY Bar" loading="lazy" /><span class="render-caption">Résumé des snapshots</span></span></span>L’authentification fonctionne sur le même principe que pour Alertmanager, avec un secret distinct côté StackStorm.<br><br>Ce qui me plaît le plus dans ce projet, c’est qu’il n’a finalement demandé ni nouveau matériel, ni modification du firmware. La BUSY Bar avait déjà presque tout ce qu’il fallait. J’ai simplement ajouté une petite couche entre son API et Internet. Flipper prévoit à terme de permettre l’installation de vraies applications sur la barre. Ça rendra probablement certains de ces usages plus simples ou plus propres. Mais en attendant, l’API HTTP va déjà étonnamment loin.<br><br>Un projet complètement inutile, donc forcément indispensable. 😁'

unifi-ap-lab-rax-mount:
  date: '2026-08-17'
  tags: ['homelab', '3d-printing', 'networking']
  cover: 'lab-rax-u7-mount-installed.jpg'
  title:
    en: "Mounting a UniFi AP on top of my rack"
    fr: "Monter un point d’accès UniFi au-dessus de mon rack"
  excerpt:
    en: "A custom top panel gives my Lab Rax rack its own UniFi access point, angled forward instead of pointing at the ceiling."
    fr: "Un panneau du dessus sur mesure donne à mon rack Lab Rax son propre point d’accès UniFi, orienté vers l’avant plutôt que vers le plafond."
  body:
    en: 'I already have a fair number of IoT devices on my home LAN. Recently, after getting a <a href="https://busy.app/" target="_blank" rel="noopener">BUSY Bar</a>, I decided to use my homelab to isolate them from the rest of my network, mainly for security reasons. A full write-up on the BUSY Bar is <s>coming later</s> <a href="../busy-bar-message-wall/">available now</a>, and you can already send it a message from the <a href="https://khaddict.com/">homepage</a>.<br><br>So I created a dedicated VLAN for them, and since that meant getting a proper access point anyway, I deployed a UniFi OS Server as an LXC container on my Proxmox node (via the <a href="https://community-scripts.org/scripts/unifi-os-server" target="_blank" rel="noopener">community-scripts script</a>) to manage both the switch and the new AP from one place.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-topology.png" alt="UniFi Network topology view showing the switch, the U7 Pro and the BUSY Bar connected through it" loading="lazy" /><span class="render-caption">Topology</span></span><span class="render-item"><img src="{MEDIA}/gallery/uos-server-dashboard.png" alt="UniFi OS Server dashboard showing the LXC’s uptime and system status" loading="lazy" /><span class="render-caption">UniFi dashboard</span></span></span>I picked up a <a href="https://eu.store.ui.com/eu/en/products/u7-pro" target="_blank" rel="noopener">UniFi U7 Pro</a>, powered via PoE by the same <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> that already powers the JetKVM on the rack.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-switch-ports.png" alt="UniFi Network port table showing the U7 Pro connected over PoE alongside the rack’s other devices" loading="lazy" /><span class="render-caption">Switch ports</span></span></span>Once the AP was adopted in UniFi Network, I set up a dedicated Wi-Fi network for the IoT devices (VLAN 50), with its own SSID, broadcast only on 2.4 GHz by the U7 Pro. The BUSY Bar doesn’t need anything faster, and it keeps that traffic off the 5 and 6 GHz bands where it doesn’t need to be.<br><br>On the firewall side, that VLAN is blocked by default in every direction, including outbound internet access. IoT firmware is rarely well maintained, so I’d rather completely prevent a compromised device from contacting the outside world or joining a botnet than just isolate it from the rest of my LAN. Only DNS and NTP to the firewall are allowed, with one narrow exception letting my API VM push messages to the BUSY Bar over TCP/80; nothing on that VLAN can initiate an outbound connection. For now, this network mostly serves the BUSY Bar, with room for whatever else I plug into it later.<br><br>Nice side effect: Wi-Fi in my bedroom got noticeably better too, since the AP is now much closer than the one that used to cover that room.<br><br>The AP worked great from day one, but I didn’t want it sitting on a shelf or screwed to a wall next to the rack. The whole point of building the Lab Rax was to have everything in one clean, self-contained unit, so the access point needed to actually be part of it rather than bolted on beside it.<br><br>The top panel already has a fan opening and handles I wanted to keep usable. A generic wall or ceiling mount wasn’t going to cut it. I designed a replacement top panel with two integrated supports that hold the U7 Pro at roughly a 45-degree angle, facing forward into the room instead of straight up. The mounting interface itself is a separate printable adapter, screwed onto the supports with four M3 screws, so the twist-lock geometry could be printed flat instead of at an angle, which matters a lot for how cleanly that part comes out.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-render.png" alt="CAD render of the top panel supports and the separate U7 mounting adapter" loading="lazy" /><span class="render-caption">Panel and adapter, split apart</span></span></span>I printed both parts in PETG, which is basically my default for anything structural on this rack by now. Printing the adapter separately let me test the fit against the real AP before committing to final assembly.<br><br>Now the AP sits right above the rack, angled into the room.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-installed.jpg" alt="The UniFi U7 Pro mounted above the Lab Rax rack" loading="lazy" /><span class="render-caption">Mounted and running</span></span></span>I published the design on <a href="https://makerworld.com/en/models/3181762-unifi-u7-pro-45deg-mount-for-lab-rax-homelab-rack" target="_blank" rel="noopener">MakerWorld</a> if anyone else with a Lab Rax wants to do the same. 😄'
    fr: 'J’ai pas mal d’appareils IoT sur mon réseau à la maison. Récemment, avec l’arrivée de la <a href="https://busy.app/" target="_blank" rel="noopener">BUSY Bar</a>, j’ai décidé d’utiliser mon homelab pour les isoler du reste du réseau, principalement pour des raisons de sécurité. Un article dédié à la BUSY Bar <s>arrivera plus tard</s> est <a href="../busy-bar-message-wall/">disponible</a>, et tu peux déjà m’envoyer un message dessus depuis <a href="https://khaddict.com/fr/">l’accueil</a>.<br><br>J’ai donc créé un VLAN dédié à ces appareils, et comme ça impliquait de passer à un vrai point d’accès, j’en ai profité pour déployer un serveur UniFi OS sous forme de conteneur LXC sur mon node Proxmox (via le <a href="https://community-scripts.org/scripts/unifi-os-server" target="_blank" rel="noopener">script communautaire community-scripts</a>), pour gérer le switch et le nouveau point d’accès depuis un seul endroit.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-topology.png" alt="Vue de la topologie UniFi Network montrant le switch, le U7 Pro et la BUSY Bar connectés" loading="lazy" /><span class="render-caption">Topologie</span></span><span class="render-item"><img src="{MEDIA}/gallery/uos-server-dashboard.png" alt="Tableau de bord du serveur UniFi OS montrant l’uptime et l’état du système du LXC" loading="lazy" /><span class="render-caption">Dashboard UniFi</span></span></span>Je me suis procuré un <a href="https://eu.store.ui.com/eu/en/products/u7-pro" target="_blank" rel="noopener">UniFi U7 Pro</a>, alimenté en PoE par le même <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> qui alimente déjà le JetKVM sur le rack.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/uos-server-switch-ports.png" alt="Table des ports UniFi Network montrant le U7 Pro connecté en PoE aux côtés des autres appareils du rack" loading="lazy" /><span class="render-caption">Ports du switch</span></span></span>Une fois le point d’accès adopté dans UniFi Network, j’ai créé un réseau Wi-Fi dédié aux appareils IoT (VLAN 50), avec son propre SSID diffusé uniquement en 2,4 GHz par le U7 Pro. La BUSY Bar n’a besoin de rien de plus rapide, et ça évite de faire circuler ce trafic sur les bandes 5 et 6 GHz pour rien.<br><br>Côté firewall, ce VLAN est bloqué par défaut dans toutes les directions, y compris vers internet. Le firmware des objets connectés est rarement bien maintenu, donc je préfère empêcher complètement un appareil compromis de contacter l’extérieur ou de rejoindre un botnet, plutôt que de me contenter de l’isoler du reste de mon LAN. Seuls le DNS et le NTP vers le firewall sont autorisés, avec une unique exception qui permet à ma VM API d’envoyer des messages à la BUSY Bar en TCP/80 ; rien sur ce VLAN ne peut initier de connexion vers l’extérieur. Pour l’instant, ce réseau sert surtout à la BUSY Bar, avec de la place pour tout ce que j’y brancherai plus tard.<br><br>Petit bonus : le Wi-Fi de ma chambre est devenu nettement meilleur, vu que le point d’accès est désormais bien plus proche que celui qui couvrait cette pièce jusque-là.<br><br>Le point d’accès a parfaitement fonctionné dès le premier jour, mais je ne voulais pas qu’il traîne sur une étagère ou soit vissé au mur à côté du rack. Tout l’intérêt du Lab Rax était d’avoir un ensemble propre et autonome, donc le point d’accès devait vraiment en faire partie plutôt que d’être accroché à côté.<br><br>Le panneau du dessus a déjà une ouverture pour le ventilateur et des poignées que je voulais garder fonctionnelles. Un support mural ou plafond générique n’allait donc pas suffire. J’ai conçu un panneau de remplacement avec deux supports intégrés qui maintiennent le U7 Pro à environ 45 degrés, orienté vers l’avant plutôt que directement vers le plafond. L’interface de fixation elle-même est un adaptateur imprimable séparé, vissé sur les supports avec quatre vis M3, ce qui permet d’imprimer le système de fixation quart-de-tour à plat plutôt qu’en biais, ce qui fait une vraie différence sur la qualité de cette pièce.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-render.png" alt="Rendu CAO des supports du panneau et de l’adaptateur de fixation du U7" loading="lazy" /><span class="render-caption">Panneau et adaptateur, séparés</span></span></span>J’ai imprimé les deux pièces en PETG, qui est devenu mon choix par défaut pour tout ce qui est structurel sur ce rack. Imprimer l’adaptateur séparément m’a permis de tester l’ajustement avec le vrai point d’accès avant de passer à l’assemblage final.<br><br>Le point d’accès est maintenant installé juste au-dessus du rack, orienté vers la pièce.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-u7-mount-installed.jpg" alt="Le UniFi U7 Pro monté au-dessus du rack Lab Rax" loading="lazy" /><span class="render-caption">Installé et en fonctionnement</span></span></span>J’ai publié le modèle sur <a href="https://makerworld.com/en/models/3181762-unifi-u7-pro-45deg-mount-for-lab-rax-homelab-rack" target="_blank" rel="noopener">MakerWorld</a> si quelqu’un d’autre avec un Lab Rax veut faire pareil. 😄'
