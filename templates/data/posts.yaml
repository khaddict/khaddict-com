first-print-bambu-lab-p2s:
  date: '2026-07-23'
  tags: ['3d-printing']
  title:
    en: "First prints on the Bambu Lab P2S"
    fr: "Premières impressions sur la Bambu Lab P2S"
  excerpt:
    en: "A Bambu Lab P2S, a Benchy to test it, and a handful of upgrades printed in PETG."
    fr: "Une Bambu Lab P2S, un Benchy pour la tester, et quelques améliorations imprimées en PETG."
  body:
    en: 'I gave myself a Bambu Lab P2S. I already had a long list of things I wanted to print, so as soon as it arrived, I downloaded <a href="https://bambulab.com/en-us/download/studio" target="_blank" rel="noopener">Bambu Studio</a> and went straight to <a href="https://makerworld.com/en" target="_blank" rel="noopener">Makerworld</a>.<br><br>Unboxing and setup were both quick, and the printer looks genuinely good. It is also much quieter than I expected, and print speeds are impressive.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/bambu-lab-p2s-setup.jpg" alt="The Bambu Lab P2S with the AMS Pro 2 loaded" loading="lazy" /><span class="render-caption">P2S with the AMS Pro 2</span></span></span>Naturally, my first print was a <a href="https://makerworld.com/en/models/2334618-benchy-optimised-for-all-filaments?from=search#profileId-2551409" target="_blank" rel="noopener">Benchy</a>, the small boat that most 3D printing communities recommend as a first print. It is a good way to check overhangs, bridging and first layer quality before printing anything that matters (it could also be seen as a rite of passage when starting out in 3D printing). <span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/p2s-benchy-timelapse.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Benchy timelapse</span></span></span>Once the Benchy printed correctly, the next few prints were about making the printer easier to use day to day, all in <span class="term" tabindex="0">PETG<span class="term-tip">PETG (Polyethylene Terephthalate Glycol): tougher and more heat-resistant than PLA, without the warping and fumes of ABS. A solid default for functional, everyday parts.</span></span>. I ended up buying around fifteen spools. I only have one AMS Pro 2, which holds four at a time, so the rest wait their turn in their boxes.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-petg-spool-boxes.jpg" alt="A pile of PETG spool boxes in front of the P2S" loading="lazy" /><span class="render-caption">PETG spools, boxed</span></span></span> What I actually wanted to print was parts for my server rack and other functional pieces, and PETG suits that better.<br><br>I started with a <a href="https://makerworld.com/en/models/12702-bambu-scraper-grip#profileId-12703" target="_blank" rel="noopener">scraper</a> that was among the most downloaded files. The blade and screws come included with the P2S, so only the handle needed printing. It removes prints from the bed cleanly. There is also a <a href="https://makerworld.com/en/models/1603348-p1s-p2s-x2d-poop-bin?from=search#profileId-2973685" target="_blank" rel="noopener">poop bin</a> (that’s genuinely its name), since the printer purges filament between prints or after a color change.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-prints-batch-one.jpg" alt="The Benchy, scraper and poop bin" loading="lazy" /><span class="render-caption">Benchy, scraper, poop bin</span></span></span>I also printed an <a href="https://makerworld.com/en/models/1926190-p2s-and-x2d-auxiliary-fan-diffuser" target="_blank" rel="noopener">auxiliary fan diffuser</a> to help with warping, and a set of <a href="https://makerworld.com/en/models/1893614-p2s-x2d-dustcover-for-the-holes-on-the-bottom" target="_blank" rel="noopener">dust covers for the holes on the bottom</a>. Five prints in so far, all of them successful. Mostly upgrades rather than actual projects, but that seems like a normal way to start with a new printer. Next up: the rack that will hold my homelab. I have already ordered a <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> powered over PoE, which also meant switching to a <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>.'
    fr: 'Je me suis offert une Bambu Lab P2S. J’avais déjà une longue liste de choses à imprimer, donc dès qu’elle est arrivée, j’ai téléchargé <a href="https://bambulab.com/fr-fr/download/studio" target="_blank" rel="noopener">Bambu Studio</a> et je suis allé directement sur <a href="https://makerworld.com/fr" target="_blank" rel="noopener">Makerworld</a>.<br><br>Le déballage et l’installation ont été rapides, et l’imprimante est visuellement très réussie. Elle est aussi beaucoup plus silencieuse que je ne l’imaginais, et les vitesses d’impression sont impressionnantes.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/bambu-lab-p2s-setup.jpg" alt="La Bambu Lab P2S avec l’AMS Pro 2 chargé" loading="lazy" /><span class="render-caption">P2S avec l’AMS Pro 2</span></span></span>Évidemment, ma première impression a été un <a href="https://makerworld.com/en/models/2334618-benchy-optimised-for-all-filaments?from=search#profileId-2551409" target="_blank" rel="noopener">Benchy</a>, le petit bateau que la plupart des communautés d’impression 3D recommandent en premier. C’est un bon moyen de vérifier les surplombs, les ponts et la qualité de la première couche avant d’imprimer quelque chose d’important (on peut aussi voir ça comme un passage obligé lorsqu’on commence l’impression 3D). <span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/p2s-benchy-timelapse.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Timelapse du Benchy</span></span></span>Une fois le Benchy imprimé correctement, les impressions suivantes ont servi à rendre l’imprimante plus pratique au quotidien, toutes en <span class="term" tabindex="0">PETG<span class="term-tip">PETG (polyéthylène téréphtalate glycolisé) : plus résistant et plus tolérant à la chaleur que le PLA, sans le gauchissement ni les émanations de l’ABS. Un bon choix par défaut pour des pièces fonctionnelles du quotidien.</span></span>. Je me suis retrouvé à acheter une quinzaine de bobines. Je n’ai qu’un seul AMS Pro 2, qui n’en accueille que quatre à la fois, donc les autres attendent leur tour dans leurs cartons.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-petg-spool-boxes.jpg" alt="Une pile de cartons de bobines PETG devant la P2S" loading="lazy" /><span class="render-caption">Bobines de PETG, en carton</span></span></span> Ce que je voulais surtout imprimer, ce sont des pièces pour mon rack informatique et d’autres pièces fonctionnelles, pour lesquelles le PETG convient mieux.<br><br>J’ai commencé par une <a href="https://makerworld.com/en/models/12702-bambu-scraper-grip#profileId-12703" target="_blank" rel="noopener">raclette</a> qui était parmi les fichiers les plus téléchargés. La lame et les vis sont fournies avec la P2S, il ne restait donc que la poignée à imprimer. Elle sert à retirer les impressions du plateau proprement. Il y a aussi une <a href="https://makerworld.com/en/models/1603348-p1s-p2s-x2d-poop-bin?from=search#profileId-2973685" target="_blank" rel="noopener">corbeille à caca</a> (c’est vraiment son nom), parce que l’imprimante purge du filament entre deux impressions ou après un changement de couleur.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-prints-batch-one.jpg" alt="Le Benchy, la raclette et la corbeille à caca" loading="lazy" /><span class="render-caption">Benchy, raclette, corbeille à caca</span></span></span>J’ai aussi imprimé un <a href="https://makerworld.com/en/models/1926190-p2s-and-x2d-auxiliary-fan-diffuser" target="_blank" rel="noopener">diffuseur de ventilateur auxiliaire</a> pour limiter le gauchissement, ainsi que des <a href="https://makerworld.com/en/models/1893614-p2s-x2d-dustcover-for-the-holes-on-the-bottom" target="_blank" rel="noopener">caches pour les trous du dessous</a>. Cinq impressions pour l’instant, toutes réussies. Surtout des améliorations plutôt que de vrais projets, mais ça semble être une façon normale de démarrer avec une nouvelle imprimante. La suite : le rack qui contiendra mon homelab. J’ai déjà commandé un <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> alimenté via PoE, ce qui m’a aussi obligé à changer de switch pour un <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>.'

the-lab-rax:
  date: '2026-08-04'
  tags: ['homelab', '3d-printing']
  title:
    en: "Printing a rack for my homelab"
    fr: "Imprimer un rack pour mon homelab"
  excerpt:
    en: "A scattered homelab finally gets a proper rack, with custom-printed shelves for the parts nothing off the shelf would fit."
    fr: "Un homelab dispersé a enfin un vrai rack, avec des étagères imprimées sur mesure pour ce que rien de prêt à l’emploi ne voulait accueillir."
  body:
    en: 'My homelab has never been particularly organized: hardware scattered around, cables everywhere, nothing actually held in place. Recently I decided it was time for an actual rack, and the <a href="https://makerworld.com/en/collections/5813742-lab-rax" target="_blank" rel="noopener">Lab Rax</a> project was exactly what I needed. The rack itself turned out to be the easy part. Finding proper rack-mount shelves for my GEEKOM A9 Max mini PC or my Raspberry Pi 5 in its FLIRC case was not: nothing ready-made really fit either of them.<br><br>It is a 10-inch Lab Rax, which explains the format for every printed shelf that follows. Here are a few videos of the skeleton being printed:<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/lab-rax-corner-edges.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Corner edges</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-top-front-edge.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Top-front edge</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-bottom-front-edge-handle.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bottom-front edge and handles</span></span></span> One of the side panels came out warped after I pulled it off the bed too hot (you should avoid doing that), so it had to be reprinted. Since nothing off the shelf fit, I designed and printed my own shelves, and published them on <a href="https://makerworld.com/en/@khaddict/upload" target="_blank" rel="noopener">Makerworld</a>: a <a href="https://makerworld.com/en/models/3122060-geekom-a9-max-4-3u-mini-pc-tray-for-10-rack#profileId-3522107" target="_blank" rel="noopener">4/3U tray for the GEEKOM A9 Max</a> mini PC and a <a href="https://makerworld.com/en/models/3120554-1u-10-rack-tray-for-raspberry-pi-5-in-flirc-case#profileId-3520277" target="_blank" rel="noopener">1U tray for the Raspberry Pi 5 in its FLIRC case</a>, both printed in PETG.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-pi5-tray-render.png" alt="The Raspberry Pi 5 shelf, as designed" loading="lazy" /><span class="render-caption">Raspberry Pi 5 shelf</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-geekom-tray-render.png" alt="The GEEKOM A9 Max shelf, as designed" loading="lazy" /><span class="render-caption">GEEKOM A9 Max shelf</span></span></span>When it comes to the physical hardware, losing network on a node and still being able to reach its console is where a KVM matters, so a <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> now sits right on the rack, wired to its own port and powered entirely over PoE. That single requirement is also why the old switch is gone, replaced with a <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> feeding it directly.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-day.jpg" alt="The JetKVM and the Ubiquiti PoE switch mounted on the rack" loading="lazy" /><span class="render-caption">By day</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-night.jpg" alt="The same view at night, with the RGB fan lit up" loading="lazy" /><span class="render-caption">By night</span></span></span>The rack finally looks like something real, and I genuinely love it. Cooling comes from an RGB fan, and a 1U power strip gives the equipment on the rack somewhere to plug in. Cables are still cables, but at least they are now behind a <a href="https://makerworld.com/en/models/3120435-1u-brush-cable-management-panel-for-lab-rax-10#profileId-3520062" target="_blank" rel="noopener">brush panel</a> and inside the rack. It started out as a panel bought on Amazon, but to keep the rack color-consistent, I ended up redesigning it as a 3D print.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-brush-panel.jpg" alt="The brush cable panel and fan mount, installed" loading="lazy" /><span class="render-caption">Brush panel</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-cable-management.jpg" alt="Power and cabling routed through the back of the rack" loading="lazy" /><span class="render-caption">Cable routing</span></span></span>'
    fr: 'Mon homelab n’a jamais été très organisé : du matériel éparpillé un peu partout, des câbles dans tous les sens, rien de vraiment fixé. Récemment, j’ai décidé qu’il était temps d’avoir un vrai rack, et le projet <a href="https://makerworld.com/fr/collections/5813742-lab-rax" target="_blank" rel="noopener">Lab Rax</a> correspondait exactement à mon besoin. Le rack en lui-même s’est révélé être la partie facile. Trouver des étagères de rack adaptées pour mon mini PC GEEKOM A9 Max ou mon Raspberry Pi 5 dans son boîtier FLIRC l’était moins : rien de prêt à l’emploi ne correspondait vraiment à l’un ou l’autre.<br><br>C’est un Lab Rax 10 pouces, ce qui explique le format de toutes les étagères imprimées qui suivent. Voici quelques vidéos du squelette qui s’imprime :<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/lab-rax-corner-edges.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bords d’angle</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-top-front-edge.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bord haut-avant</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-bottom-front-edge-handle.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bord bas-avant et poignées</span></span></span> Un des panneaux latéraux est ressorti déformé après que je l’ai retiré du plateau encore chaud (il faut éviter de faire ça), donc il a fallu le réimprimer. Comme rien de prêt à l’emploi ne convenait, j’ai dessiné et imprimé mes propres étagères, et je les ai publiées sur <a href="https://makerworld.com/en/@khaddict/upload" target="_blank" rel="noopener">Makerworld</a> : un <a href="https://makerworld.com/en/models/3122060-geekom-a9-max-4-3u-mini-pc-tray-for-10-rack#profileId-3522107" target="_blank" rel="noopener">tiroir 4/3U pour le GEEKOM A9 Max</a> et un <a href="https://makerworld.com/en/models/3120554-1u-10-rack-tray-for-raspberry-pi-5-in-flirc-case#profileId-3520277" target="_blank" rel="noopener">tiroir 1U pour le Raspberry Pi 5 dans son boîtier FLIRC</a>, tous les deux imprimés en PETG.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-pi5-tray-render.png" alt="L’étagère Raspberry Pi 5, telle que dessinée" loading="lazy" /><span class="render-caption">Étagère Raspberry Pi 5</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-geekom-tray-render.png" alt="L’étagère GEEKOM A9 Max, telle que dessinée" loading="lazy" /><span class="render-caption">Étagère GEEKOM A9 Max</span></span></span>Côté matériel physique, un <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> est maintenant posé directement sur le rack, câblé sur son propre port et alimenté entièrement en PoE, pour pouvoir récupérer l’accès à un node même en cas de perte du réseau. C’est justement cette contrainte qui a fait sauter l’ancien switch, remplacé par un <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> qui l’alimente directement.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-day.jpg" alt="Le JetKVM et le switch PoE Ubiquiti montés sur le rack" loading="lazy" /><span class="render-caption">De jour</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-night.jpg" alt="La même vue de nuit, avec le ventilateur RGB allumé" loading="lazy" /><span class="render-caption">De nuit</span></span></span>Le rack ressemble enfin à quelque chose et personnellement je l’adore. Le refroidissement vient d’un ventilateur RGB, et une rallonge 1U permet de brancher les équipements du rack. Les câbles restent des câbles, mais au moins ils sont maintenant derrière un <a href="https://makerworld.com/en/models/3120435-1u-brush-cable-management-panel-for-lab-rax-10#profileId-3520062" target="_blank" rel="noopener">panneau à brosse</a> et dans le rack. À la base, c’était un panneau acheté sur Amazon, mais pour que le rack reste uniforme en couleur, j’ai dû en redessiner un modèle 3D.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-brush-panel.jpg" alt="Le panneau brosse et le support de ventilateur, installés" loading="lazy" /><span class="render-caption">Panneau à brosse</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-cable-management.jpg" alt="Alimentation et câblage routés à l’arrière du rack" loading="lazy" /><span class="render-caption">Câblage arrière</span></span></span>'
