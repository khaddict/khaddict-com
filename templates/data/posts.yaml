first-prints-bambu-lab-p2s:
  date: '2026-07-23'
  tags: ['3d-printing']
  title:
    en: "First prints on the Bambu Lab P2S"
    fr: "Premières impressions avec la Bambu Lab P2S"
  excerpt:
    en: "A Bambu Lab P2S, a Benchy to test it, and a handful of upgrades printed in PETG."
    fr: "Une Bambu Lab P2S, un Benchy pour la tester et quelques améliorations imprimées en PETG."
  body:
    en: 'I offered myself a Bambu Lab P2S. I already had a long list of things I wanted to print, so as soon as it arrived, I downloaded <a href="https://bambulab.com/en-us/download/studio" target="_blank" rel="noopener">Bambu Studio</a> and went straight to <a href="https://makerworld.com/en" target="_blank" rel="noopener">Makerworld</a>.<br><br>Unboxing and setup were both quick, and the printer looks great. It is also much quieter than I expected, and the print speeds are impressive.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/bambu-lab-p2s-setup.jpg" alt="The Bambu Lab P2S with the AMS 2 Pro loaded" loading="lazy" /><span class="render-caption">P2S with the AMS 2 Pro</span></span></span>Naturally, my first print was a <a href="https://makerworld.com/en/models/2334618-benchy-optimised-for-all-filaments?from=search#profileId-2551409" target="_blank" rel="noopener">Benchy</a>, the little boat that has become a standard first print in the 3D-printing community. It is a good way to check overhangs, bridging, and first-layer quality before printing anything that matters (it is also something of a rite of passage when getting into 3D printing). <span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/p2s-benchy-timelapse.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Benchy timelapse</span></span></span>Once the Benchy came out cleanly, the next few prints were all about making the printer easier to use day to day, all in <span class="term" tabindex="0">PETG<span class="term-tip">PETG (Polyethylene Terephthalate Glycol): tougher and more heat-resistant than PLA, without the warping and fumes of ABS. A solid default for functional, everyday parts.</span></span>. I ended up buying around fifteen spools. I only have one AMS 2 Pro, which holds four at a time, so the rest wait their turn in their boxes.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-petg-spool-boxes.jpg" alt="A pile of PETG spool boxes in front of the P2S" loading="lazy" /><span class="render-caption">PETG spools, boxed</span></span></span> What I really bought the printer for, though, was parts for my server rack and other functional pieces, and PETG is better suited to that.<br><br>I started with a <a href="https://makerworld.com/en/models/12702-bambu-scraper-grip#profileId-12703" target="_blank" rel="noopener">scraper</a>, one of the most-downloaded models. The blade and screws are included with the P2S, so only the handle needed printing. It removes prints from the bed cleanly. I also printed a <a href="https://makerworld.com/en/models/1603348-p1s-p2s-x2d-poop-bin?from=search#profileId-2973685" target="_blank" rel="noopener">poop bin</a> (that is genuinely its name), which catches the filament the printer purges between prints or after a color change.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-prints-batch-one.jpg" alt="The Benchy, scraper and poop bin" loading="lazy" /><span class="render-caption">Benchy, scraper, poop bin</span></span></span>I also printed an <a href="https://makerworld.com/en/models/1926190-p2s-and-x2d-auxiliary-fan-diffuser" target="_blank" rel="noopener">auxiliary fan diffuser</a> to help reduce warping, along with a set of <a href="https://makerworld.com/en/models/1893614-p2s-x2d-dustcover-for-the-holes-on-the-bottom" target="_blank" rel="noopener">dust covers for the holes on the bottom</a>. Five prints in so far, and all five came out clean. Mostly upgrades rather than actual projects, but that seems like a pretty normal way to start with a new printer. An under-printer storage unit is already underway, and a riser for the AMS 2 Pro is queued up next, before the bigger project: the rack that will hold my homelab. I have already ordered a <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> powered over PoE, which also meant replacing my switch with a <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>.'
    fr: 'Je me suis offert une Bambu Lab P2S. J’avais déjà une longue liste de choses à imprimer, donc dès qu’elle est arrivée, j’ai téléchargé <a href="https://bambulab.com/fr-fr/download/studio" target="_blank" rel="noopener">Bambu Studio</a> et je suis allé directement sur <a href="https://makerworld.com/fr" target="_blank" rel="noopener">Makerworld</a>.<br><br>Le déballage et l’installation ont été rapides, et l’imprimante est vraiment belle. Elle est aussi beaucoup plus silencieuse que je ne l’imaginais, et les vitesses d’impression sont impressionnantes.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/bambu-lab-p2s-setup.jpg" alt="La Bambu Lab P2S avec l’AMS 2 Pro chargé" loading="lazy" /><span class="render-caption">P2S avec l’AMS 2 Pro</span></span></span>Évidemment, ma première impression a été un <a href="https://makerworld.com/en/models/2334618-benchy-optimised-for-all-filaments?from=search#profileId-2551409" target="_blank" rel="noopener">Benchy</a>, le petit bateau devenu un grand classique comme première impression dans la communauté de l’impression 3D. C’est un bon moyen de vérifier les porte-à-faux, les ponts et la qualité de la première couche avant d’imprimer quelque chose d’important (c’est aussi un peu un passage obligé quand on se lance dans l’impression 3D). <span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/p2s-benchy-timelapse.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Timelapse du Benchy</span></span></span>Une fois le Benchy sorti proprement, les impressions suivantes ont surtout servi à rendre l’imprimante plus pratique au quotidien, toutes en <span class="term" tabindex="0">PETG<span class="term-tip">PETG (polyéthylène téréphtalate glycolisé) : plus résistant et plus tolérant à la chaleur que le PLA, sans le gauchissement ni les émanations de l’ABS. Un bon choix par défaut pour des pièces fonctionnelles du quotidien.</span></span>. J’ai fini par acheter une quinzaine de bobines. Je n’ai qu’un seul AMS 2 Pro, qui n’en accueille que quatre à la fois, donc les autres attendent leur tour dans leurs cartons.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-petg-spool-boxes.jpg" alt="Une pile de cartons de bobines PETG devant la P2S" loading="lazy" /><span class="render-caption">Bobines de PETG, en carton</span></span></span> Ce que je voulais surtout imprimer, c’était des pièces pour mon rack serveur et d’autres pièces fonctionnelles, pour lesquelles le PETG est mieux adapté.<br><br>J’ai commencé par une <a href="https://makerworld.com/en/models/12702-bambu-scraper-grip#profileId-12703" target="_blank" rel="noopener">raclette</a>, l’un des modèles les plus téléchargés. La lame et les vis sont fournies avec la P2S, il ne restait donc que la poignée à imprimer. Elle permet de retirer proprement les impressions du plateau. J’ai aussi imprimé une <a href="https://makerworld.com/en/models/1603348-p1s-p2s-x2d-poop-bin?from=search#profileId-2973685" target="_blank" rel="noopener">corbeille à caca</a> (oui, c’est vraiment son nom), un bac qui récupère le filament purgé entre deux impressions ou après un changement de couleur.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-prints-batch-one.jpg" alt="Le Benchy, la raclette et la corbeille à caca" loading="lazy" /><span class="render-caption">Benchy, raclette, corbeille à caca</span></span></span>J’ai également imprimé un <a href="https://makerworld.com/en/models/1926190-p2s-and-x2d-auxiliary-fan-diffuser" target="_blank" rel="noopener">diffuseur de ventilateur auxiliaire</a> pour limiter le gauchissement, ainsi que des <a href="https://makerworld.com/en/models/1893614-p2s-x2d-dustcover-for-the-holes-on-the-bottom" target="_blank" rel="noopener">caches pour les ouvertures sous l’imprimante</a>. Cinq impressions pour l’instant, toutes réussies. Ce sont surtout des améliorations plutôt que de vrais projets, mais j’ai l’impression que c’est assez classique quand on débute avec une nouvelle imprimante. Un rangement sous l’imprimante est déjà en cours d’impression, et un réhausseur pour l’AMS 2 Pro est le suivant sur la liste avant le plus gros projet : le rack qui accueillera mon homelab. J’ai déjà commandé un <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> alimenté en PoE, ce qui m’a aussi poussé à remplacer mon switch par un <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>.'

the-lab-rax:
  date: '2026-08-04'
  tags: ['homelab', '3d-printing']
  title:
    en: "Printing a rack for my homelab"
    fr: "Imprimer un rack pour mon homelab"
  excerpt:
    en: "My homelab finally has a proper 3D-printed rack, with custom shelves for its hardware."
    fr: "Mon homelab a enfin un vrai rack imprimé en 3D, avec des étagères personnalisées pour son matériel."
  body:
    en: 'My homelab has never been particularly organized: hardware scattered around, cables everywhere, nothing actually held in place. Recently, I decided it was time for a proper rack, and the <a href="https://makerworld.com/en/collections/5813742-lab-rax" target="_blank" rel="noopener">Lab Rax</a> project was exactly what I needed. The rack itself turned out to be the easy part. Finding proper rack-mount shelves for my GEEKOM A9 Max mini PC or my Raspberry Pi 5 in its FLIRC case was not: nothing ready-made really fit either of them.<br><br>It is a 10-inch Lab Rax, which explains the format of every printed shelf that follows. Here are a few videos of the frame being printed:<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/lab-rax-corner-edges.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Corner pieces</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-top-front-edge.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Top front edge</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-bottom-front-edge-handle.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bottom front edge and handles</span></span></span> One of the side panels came out warped after I pulled it off the bed while it was still too hot (a rookie mistake), so it had to be reprinted. Since nothing off the shelf fit, I designed and printed my own shelves and published them on <a href="https://makerworld.com/en/@khaddict/upload" target="_blank" rel="noopener">Makerworld</a>: a <a href="https://makerworld.com/en/models/3122060-geekom-a9-max-4-3u-mini-pc-tray-for-10-rack#profileId-3522107" target="_blank" rel="noopener">4/3U tray for the GEEKOM A9 Max</a> mini PC and a <a href="https://makerworld.com/en/models/3120554-1u-10-rack-tray-for-raspberry-pi-5-in-flirc-case#profileId-3520277" target="_blank" rel="noopener">1U tray for the Raspberry Pi 5 in its FLIRC case</a>, both printed in PETG.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-pi5-tray-render.png" alt="The Raspberry Pi 5 shelf, as designed" loading="lazy" /><span class="render-caption">Raspberry Pi 5 shelf</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-geekom-tray-render.png" alt="The GEEKOM A9 Max shelf, as designed" loading="lazy" /><span class="render-caption">GEEKOM A9 Max shelf</span></span></span>On the hardware side, the whole point of a KVM is being able to reach a node’s console even when its network connection is down. A <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> now sits right on the rack, connected to its own switch port and powered entirely over PoE. That single requirement is also why the old switch is gone, replaced with a <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a> feeding it directly.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-day.jpg" alt="The JetKVM and the Ubiquiti PoE switch mounted on the rack" loading="lazy" /><span class="render-caption">By day</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-night.jpg" alt="The same view at night, with the RGB fan lit up" loading="lazy" /><span class="render-caption">By night</span></span></span>The rack finally feels like a proper setup, and I love it. An RGB fan handles cooling, and a 1U power strip gives everything in the rack a proper place to plug in. Cables are still cables, but at least they are now routed behind a <a href="https://makerworld.com/en/models/3120435-1u-brush-cable-management-panel-for-lab-rax-10#profileId-3520062" target="_blank" rel="noopener">brush panel</a> and kept inside the rack. The brush panel started out as one I bought on Amazon, but to keep the color scheme consistent, I ended up redesigning it and printing my own version.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-brush-panel.jpg" alt="The brush cable panel and fan mount, installed" loading="lazy" /><span class="render-caption">Brush panel</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-cable-management.jpg" alt="Power and cabling routed through the back of the rack" loading="lazy" /><span class="render-caption">Cable routing</span></span></span>'
    fr: 'Mon homelab n’a jamais été particulièrement organisé : du matériel éparpillé un peu partout, des câbles dans tous les sens, rien de vraiment fixé. Récemment, j’ai décidé qu’il était temps de passer à un vrai rack, et le projet <a href="https://makerworld.com/fr/collections/5813742-lab-rax" target="_blank" rel="noopener">Lab Rax</a> correspondait exactement à ce qu’il me fallait. Le rack lui-même s’est finalement révélé être la partie la plus simple. Trouver des étagères adaptées au format rack pour mon mini PC GEEKOM A9 Max ou mon Raspberry Pi 5 dans son boîtier FLIRC l’était beaucoup moins : rien de prêt à l’emploi ne convenait vraiment à l’un ou à l’autre.<br><br>C’est un Lab Rax 10 pouces, ce qui explique le format de toutes les étagères imprimées qui suivent. Voici quelques vidéos de l’impression de la structure :<span class="render-pair"><span class="render-item"><video src="{MEDIA}/videos/lab-rax-corner-edges.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Pièces d’angle</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-top-front-edge.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bord supérieur avant</span></span><span class="render-item"><video src="{MEDIA}/videos/lab-rax-bottom-front-edge-handle.mp4" controls playsinline preload="metadata"></video><span class="render-caption">Bord inférieur avant et poignées</span></span></span> L’un des panneaux latéraux s’est déformé parce que je l’ai retiré du plateau alors qu’il était encore trop chaud (mauvaise idée), donc il a fallu le réimprimer. Comme rien de prêt à l’emploi ne convenait, j’ai conçu et imprimé mes propres étagères, puis je les ai publiées sur <a href="https://makerworld.com/en/@khaddict/upload" target="_blank" rel="noopener">Makerworld</a> : un <a href="https://makerworld.com/en/models/3122060-geekom-a9-max-4-3u-mini-pc-tray-for-10-rack#profileId-3522107" target="_blank" rel="noopener">tiroir 4/3U pour le GEEKOM A9 Max</a> et un <a href="https://makerworld.com/en/models/3120554-1u-10-rack-tray-for-raspberry-pi-5-in-flirc-case#profileId-3520277" target="_blank" rel="noopener">tiroir 1U pour le Raspberry Pi 5 dans son boîtier FLIRC</a>, tous les deux imprimés en PETG.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-pi5-tray-render.png" alt="L’étagère Raspberry Pi 5, telle que conçue" loading="lazy" /><span class="render-caption">Étagère Raspberry Pi 5</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-geekom-tray-render.png" alt="L’étagère GEEKOM A9 Max, telle que conçue" loading="lazy" /><span class="render-caption">Étagère GEEKOM A9 Max</span></span></span>Côté matériel, tout l’intérêt d’un KVM est de pouvoir accéder à la console d’un node même si sa connexion réseau tombe. Un <a href="https://jetkvm.com/" target="_blank" rel="noopener">JetKVM</a> est donc maintenant installé directement sur le rack, connecté à son propre port du switch et entièrement alimenté en PoE. C’est d’ailleurs cette contrainte qui m’a fait remplacer l’ancien switch par un <a href="https://eu.store.ui.com/eu/en/products/usw-lite-8-poe" target="_blank" rel="noopener">UniFi Switch Lite 8 PoE</a>, qui l’alimente directement.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-day.jpg" alt="Le JetKVM et le switch PoE Ubiquiti montés sur le rack" loading="lazy" /><span class="render-caption">De jour</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-front-night.jpg" alt="La même vue de nuit, avec le ventilateur RGB allumé" loading="lazy" /><span class="render-caption">De nuit</span></span></span>Le rack ressemble enfin à une vraie installation, et j’adore le résultat. Un ventilateur RGB se charge du refroidissement, et une multiprise 1U permet de brancher proprement tous les équipements du rack. Les câbles restent des câbles, mais au moins ils sont maintenant routés derrière un <a href="https://makerworld.com/en/models/3120435-1u-brush-cable-management-panel-for-lab-rax-10#profileId-3520062" target="_blank" rel="noopener">panneau à brosse</a> et restent contenus à l’intérieur du rack. À l’origine, j’avais acheté ce panneau sur Amazon, mais pour garder une couleur uniforme sur l’ensemble du rack, j’ai fini par le redessiner et en imprimer ma propre version.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-brush-panel.jpg" alt="Le panneau à brosse et le support de ventilateur, installés" loading="lazy" /><span class="render-caption">Panneau à brosse</span></span><span class="render-item"><img src="{MEDIA}/gallery/lab-rax-cable-management.jpg" alt="Alimentation et câblage routés à l’arrière du rack" loading="lazy" /><span class="render-caption">Câblage arrière</span></span></span>'

more-prints-for-the-p2s:
  date: '2026-08-13'
  tags: ['3d-printing']
  title:
    en: "A few more prints for the P2S"
    fr: "Encore quelques impressions pour la P2S"
  excerpt:
    en: "A Gridfinity storage box, some under-printer storage, and a riser to raise the AMS 2 Pro onto the P2S."
    fr: "Une boîte de rangement Gridfinity, un rangement sous l’imprimante et un réhausseur pour poser l’AMS 2 Pro au-dessus de la P2S."
  body:
    en: 'A few weeks after the last post, the two prints I mentioned last time are now finished, plus one more I had not planned on.<br><br>First, a <a href="https://makerworld.com/en/models/1635998-storage-box-gridfinity#profileId-1728274" target="_blank" rel="noopener">Gridfinity storage box</a>. I bought a bunch of screws and nuts for the Lab Rax and got annoyed at having open bags of them lying around in my toolbox. Each compartment is labeled directly in the print (screws, nuts, magnets, and one for whatever does not fit anywhere else), and I also customized the front label with my own branding instead of leaving it plain.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-open.jpg" alt="The Gridfinity storage box, open and filled with hardware" loading="lazy" /><span class="render-caption">Compartments, labeled</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-closed.jpg" alt="The Gridfinity storage box, closed, with a custom branded label" loading="lazy" /><span class="render-caption">Custom label</span></span></span>Next was the <a href="https://makerworld.com/en/models/1347731-x2d-x1-p2s-p1s-poop-chute-under-printer-storage#profileId-1389787" target="_blank" rel="noopener">under-printer storage</a> I mentioned last time, which also includes a chute that routes purge waste straight down. I had already printed a poop bin, but this setup is basically an upgrade: I still need to print a small bin that slots into the storage unit. The real point is the two drawers underneath. Instead of setting the printer directly on the floor, it now sits raised on a proper storage unit.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage.jpg" alt="The under-printer storage unit, before mounting" loading="lazy" /><span class="render-caption">Before mounting</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage-installed.jpg" alt="The under-printer storage unit, installed, with a drawer open" loading="lazy" /><span class="render-caption">Installed, drawer open</span></span></span>Last up is the <a href="https://makerworld.com/en/models/2682036-x2d-p2s-riser-ams-flipper-v2#profileId-2970491" target="_blank" rel="noopener">AMS riser</a>, which raises the AMS 2 Pro while keeping the print visible from above.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-lifted.jpg" alt="The AMS 2 Pro, lifted up on the riser" loading="lazy" /><span class="render-caption">Lifted up</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-set-down.jpg" alt="The AMS 2 Pro set back down on the riser, on top of the printer" loading="lazy" /><span class="render-caption">Set down</span></span></span>Three more prints, and the P2S fits into the room a little better than it did.'
    fr: 'Quelques semaines après le dernier post, les deux impressions que j’avais annoncées sont maintenant terminées, avec en plus une troisième que je n’avais pas prévue au départ.<br><br>D’abord, une <a href="https://makerworld.com/en/models/1635998-storage-box-gridfinity#profileId-1728274" target="_blank" rel="noopener">boîte de rangement Gridfinity</a>. J’ai acheté pas mal de vis et d’écrous pour le Lab Rax et j’en ai eu marre des sachets ouverts qui traînaient dans ma caisse à outils. Chaque compartiment est étiqueté directement lors de l’impression (vis, écrous, aimants et un pour tout ce qui ne rentre nulle part ailleurs), et j’ai aussi personnalisé l’étiquette de façade avec mon propre visuel au lieu de la laisser neutre.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-open.jpg" alt="La boîte de rangement Gridfinity, ouverte et remplie de quincaillerie" loading="lazy" /><span class="render-caption">Compartiments étiquetés</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-gridfinity-storage-closed.jpg" alt="La boîte de rangement Gridfinity, fermée, avec une étiquette personnalisée" loading="lazy" /><span class="render-caption">Étiquette personnalisée</span></span></span>Ensuite, je me suis occupé du <a href="https://makerworld.com/en/models/1347731-x2d-x1-p2s-p1s-poop-chute-under-printer-storage#profileId-1389787" target="_blank" rel="noopener">rangement sous l’imprimante</a> mentionné la dernière fois, qui intègre aussi une goulotte pour évacuer les résidus de purge directement vers le bas. J’avais déjà imprimé une corbeille à caca, mais ce système est en quelque sorte une version améliorée : il me reste simplement à imprimer un petit bac à glisser dans le rangement. L’intérêt principal, ce sont les deux tiroirs en dessous. Plutôt que de poser l’imprimante directement au sol, elle repose maintenant, surélevée, sur un vrai meuble de rangement.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage.jpg" alt="Le rangement sous l’imprimante, avant montage" loading="lazy" /><span class="render-caption">Avant montage</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-under-printer-storage-installed.jpg" alt="Le rangement sous l’imprimante, installé, avec un tiroir ouvert" loading="lazy" /><span class="render-caption">Installé, tiroir ouvert</span></span></span>Dernier ajout : le <a href="https://makerworld.com/en/models/2682036-x2d-p2s-riser-ams-flipper-v2#profileId-2970491" target="_blank" rel="noopener">réhausseur d’AMS</a>, qui surélève l’AMS 2 Pro tout en gardant une vue sur l’impression par le dessus.<span class="render-pair"><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-lifted.jpg" alt="L’AMS 2 Pro, relevé sur le réhausseur" loading="lazy" /><span class="render-caption">Relevé</span></span><span class="render-item"><img src="{MEDIA}/gallery/p2s-ams-riser-set-down.jpg" alt="L’AMS 2 Pro reposé sur le réhausseur, au-dessus de l’imprimante" loading="lazy" /><span class="render-caption">Posé</span></span></span>Trois impressions de plus, et la P2S s’intègre un peu mieux dans la pièce.'

busy-bar-message-wall:
  date: '2026-08-14'
  tags: ['homelab', 'networking']
  title:
