server {
    listen 80;
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location = /.well-known/security.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files /security.txt =404;
    }

    location = /security.txt {
        return 404;
    }

    location /gallery/ {
        alias /data/gallery/;
        autoindex on;
        autoindex_format json;
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
    }

    location /icons/ {
        alias /data/icons/;
        autoindex on;
        autoindex_format json;
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
    }

    location /videos/ {
        alias /data/videos/;
        autoindex on;
        autoindex_format json;
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
    }

    location /fonts/ {
        alias /data/fonts/;
        include /etc/nginx/security-headers.conf;
        # cross-origin @font-face requests need this or browsers refuse to use the font
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backward compat: root-level image/video paths still resolve
    location ~ ^/[^/]+\.(png|jpg|jpeg|gif|webp|mp4|webm|mov)$ {
        root /data;
        try_files /icons$uri /gallery$uri /videos$uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}
