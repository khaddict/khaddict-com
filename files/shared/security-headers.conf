server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://matomo.khaddict.com; style-src 'self' 'unsafe-inline'; font-src https://media.khaddict.com; img-src 'self' https://media.khaddict.com https://api.khaddict.com data: blob:; media-src 'self' https://media.khaddict.com blob:; connect-src 'self' https://status.khaddict.com https://matomo.khaddict.com https://api.khaddict.com; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self';" always;
