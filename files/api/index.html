    function getThemeCookie() {
      try {
        var match = document.cookie.match(/(?:^|; )khaddict-theme=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : null;
      } catch (e) { return null; }
    }
    function setThemeCookie(value) {
      try {
        document.cookie = 'khaddict-theme=' + encodeURIComponent(value) + '; domain=.khaddict.com; path=/; max-age=31536000; SameSite=Lax; Secure';
      } catch (e) {}
    }
    (function () {
      var stored = getThemeCookie();
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('https://media.khaddict.com/fonts/JetBrainsMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('https://media.khaddict.com/fonts/JetBrainsMono-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('https://media.khaddict.com/fonts/JetBrainsMono-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('https://media.khaddict.com/fonts/JetBrainsMono-ExtraBold.woff2') format('woff2');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg:                 #ffffff;
      --text:               #18181b;
      --muted:              #71717a;
      --border:             rgba(24, 24, 27, .09);
      --accent:             #8b5cf6;
      --accent-2:           #c026d3;
      --up:                 #16a34a;
      --down: #dc2626; --warn: #b45309; --up-bg: #dcfce7; --warn-bg: #fef3c7; --down-bg: #fee2e2;
      --surface:            #ffffff;
      --surface-translucent: rgba(255, 255, 255, .5);
      --shadow:             rgba(24, 24, 27, .12);
      --blob-1:             rgba(139, 92, 246, .32);
      --blob-2:             rgba(192, 71, 219, .24);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:                  #1a1a22;
        --text:                #f1f5f9;
        --muted:               #94949f;
        --border:              rgba(255, 255, 255, .1);
        --accent:              #a78bfa;
        --accent-2:            #e879f9;
        --up:                  #4ade80;
        --down: #f87171; --warn: #fbbf24; --up-bg: rgba(74, 222, 128, .13); --warn-bg: rgba(251, 191, 36, .14); --down-bg: rgba(248, 113, 113, .13);
        --surface:             #22222c;
        --surface-translucent: rgba(26, 26, 34, .5);
        --shadow:              rgba(0, 0, 0, .5);
        --blob-1:              rgba(139, 92, 246, .22);
        --blob-2:              rgba(192, 71, 219, .18);
      }
    }

    :root[data-theme="light"] {
      --bg: #ffffff; --text: #18181b; --muted: #71717a; --border: rgba(24, 24, 27, .09);
      --accent: #8b5cf6; --accent-2: #c026d3; --up: #16a34a; --down: #dc2626; --warn: #b45309; --up-bg: #dcfce7; --warn-bg: #fef3c7; --down-bg: #fee2e2;
      --surface: #ffffff; --surface-translucent: rgba(255, 255, 255, .5); --shadow: rgba(24, 24, 27, .12);
      --blob-1: rgba(139, 92, 246, .32); --blob-2: rgba(192, 71, 219, .24);
    }

    :root[data-theme="dark"] {
      --bg: #1a1a22; --text: #f1f5f9; --muted: #94949f; --border: rgba(255, 255, 255, .1);
      --accent: #a78bfa; --accent-2: #e879f9; --up: #4ade80; --down: #f87171; --warn: #fbbf24; --up-bg: rgba(74, 222, 128, .13); --warn-bg: rgba(251, 191, 36, .14); --down-bg: rgba(248, 113, 113, .13);
      --surface: #22222c; --surface-translucent: rgba(26, 26, 34, .5); --shadow: rgba(0, 0, 0, .5);
      --blob-1: rgba(139, 92, 246, .22); --blob-2: rgba(192, 71, 219, .18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(620px circle at 12% -8%, var(--blob-1), transparent 60%),
        radial-gradient(520px circle at 100% 8%, var(--blob-2), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      flex-direction: column;
      transition: background-color .2s ease, color .2s ease;
    }

    .page-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .page-scroll::-webkit-scrollbar { width: 10px; }
    .page-scroll::-webkit-scrollbar-track { background: transparent; }
    .page-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    .page-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .bandeau {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: var(--surface-translucent);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      transition: background-color .2s ease, border-color .2s ease;
    }

    .bandeau-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: .85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .5rem;
      text-decoration: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: .92rem;
    }

    .brand-icon { width: 38px; height: 38px; border-radius: 8px; }

    .topnav {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .topnav a, .topnav button, .status-nav button {
      font-family: 'JetBrains Mono', monospace;
      font-size: .82rem;
      color: var(--muted);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: color .15s ease;
      padding: 0;
    }
    .topnav a, .topnav button {
      font-size: .92rem;
      font-weight: 600;
    }
    .topnav a:hover, .topnav button:hover, .status-nav button:hover,
    .topnav a:focus-visible, .topnav button:focus-visible, .status-nav button:focus-visible { color: var(--accent); }

    .bandeau-right {
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }

    .footer-links {
      position: fixed;
      bottom: 1.25rem;
      right: 1.5rem;
      z-index: 15;
      display: flex;
      gap: .5rem;
    }

    .copyright {
      position: fixed;
      bottom: 1.25rem;
      left: 1.5rem;
      z-index: 14;
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
      opacity: .7;
    }

    .icon-link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
      flex-shrink: 0;
    }
    .icon-link:hover { color: var(--accent); border-color: var(--accent); background: rgba(139, 92, 246, .08); }
    .icon-link svg { width: 16px; height: 16px; }

    .copy-toast {
      position: absolute;
      bottom: calc(100% + .5rem);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      padding: .35rem .65rem;
      border-radius: 6px;
      box-shadow: 0 8px 20px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .copying { pointer-events: none; }
    .copying svg { animation: copy-pulse 1s ease-in-out infinite; }

    @keyframes copy-pulse {
      0%, 100% { opacity: .4; }
      50% { opacity: .9; }
    }

    .hover-hint {
      position: absolute;
      bottom: calc(100% + .5rem);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      padding: .3rem .6rem;
      border-radius: 6px;
      box-shadow: 0 8px 20px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .icon-link:hover .hover-hint { opacity: 1; transform: translateX(-50%) translateY(0); }
    .icon-link.copied .hover-hint { opacity: 0 !important; }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: rgba(139, 92, 246, .08); }
    .theme-toggle svg { width: 15px; height: 15px; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    .lang-nav { position: relative; }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: .3rem;
      height: 30px;
      padding: 0 .6rem;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      font-weight: 600;
      flex-shrink: 0;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .lang-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(139, 92, 246, .08); }
    .lang-btn svg { width: 10px; height: 10px; }

    .lang-dropdown {
      position: absolute;
      top: calc(100% + .6rem);
      right: 0;
      min-width: 140px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px var(--shadow);
      padding: .4rem;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .lang-dropdown.open { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .lang-option {
      display: flex;
      text-decoration: none;
      align-items: center;
      gap: .55rem;
      width: 100%;
      text-align: left;
      padding: .45rem .6rem;
      border-radius: 6px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .lang-option:hover { background: rgba(139, 92, 246, .08); color: var(--accent); }
    .lang-flag { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; display: block; }
    .lang-option.active { color: var(--accent); font-weight: 600; }
    .lang-option-unavailable { text-decoration: line-through; opacity: .55; }
    .lang-option-unavailable:hover { background: none; color: var(--muted); }

    .search-btn {
      display: flex;
      align-items: center;
      gap: .5rem;
      height: 30px;
      padding: 0 .7rem;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      flex-shrink: 0;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .search-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(139, 92, 246, .08); }
    .search-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .search-kbd {
      font-family: 'JetBrains Mono', monospace;
      font-size: .64rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .05rem .35rem;
    }

    .search-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem 1rem;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .search-cta-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(139, 92, 246, .08); }
    .search-cta-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .cmdk-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, .45);
      display: flex;
      justify-content: center;
      padding: 12vh 1.5rem 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }
    .cmdk-overlay.open { opacity: 1; pointer-events: auto; }

    .cmdk-modal {
      width: min(560px, 100%);
      height: fit-content;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px var(--shadow);
      overflow: hidden;
      transform: translateY(-8px);
      transition: transform .15s ease;
    }
    .cmdk-overlay.open .cmdk-modal { transform: translateY(0); }

    .cmdk-input-row {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .9rem 1.1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cmdk-input-row svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
    .cmdk-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: .88rem;
    }
    .cmdk-input::placeholder { color: var(--muted); }

    .cmdk-results { overflow-y: auto; padding: .5rem; }
    .cmdk-group-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      color: var(--muted);
      padding: .5rem .6rem .3rem;
    }
    .cmdk-item {
      display: flex;
      flex-direction: column;
      gap: .15rem;
      width: 100%;
      text-align: left;
      padding: .55rem .6rem;
      border-radius: 8px;
      border: none;
      background: none;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }
    .cmdk-item.active { background: rgba(139, 92, 246, .1); }
    .cmdk-item-title { font-size: .85rem; font-weight: 600; }
    .cmdk-item-excerpt {
      font-size: .72rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cmdk-empty {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: var(--muted);
      padding: 1.5rem 0;
    }

    .cmdk-hint-row {
      display: flex;
      justify-content: center;
      gap: .5rem;
      padding: .55rem;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: .66rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .3s ease;
    }
    .dot.up   { background: var(--up); box-shadow: 0 0 0 0 rgba(22, 163, 74, .35); animation: pulse 2.5s infinite; }
    .dot.down { background: var(--down); }

    .status-nav { position: relative; }

    .status-nav::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 0;
      width: 340px;
      height: .9rem;
    }

    .dropdown {
      position: absolute;
      top: calc(100% + .9rem);
      right: 0;
      width: fit-content;
      min-width: 260px;
      max-width: min(340px, calc(100vw - 2rem));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px var(--shadow);
      padding: .7rem .8rem .8rem;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .dropdown.open,
    .status-nav:hover .dropdown { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .dropdown-line {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      padding: .45rem 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .dropdown-line.dropdown-msg { text-align: center; }
    .dropdown-line + .dropdown-line { border-top: 1px solid var(--border); }

    .dropdown-line-top {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .78rem;
      color: var(--muted);
    }
    .dropdown-name { flex: 1; color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 600; }

    .heartbeat {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }
    .heartbeat-bar {
      flex: none;
      width: 4px;
      height: 100%;
      border-radius: 1px;
      background: var(--muted);
      opacity: .35;
    }
    .heartbeat-bar.up   { background: var(--up); opacity: 1; }
    .heartbeat-bar.down { background: var(--down); opacity: 1; }
    .heartbeat-bar.pending { background: var(--warn); opacity: 1; }

    #status-btn {
      padding: .3rem .6rem .3rem .5rem;
      border-radius: 999px;
      background: var(--up-bg);
      color: var(--text);
      transition: background .15s ease;
    }
    #status-btn.warn-pill { background: var(--warn-bg); }
    #status-btn.down-pill { background: var(--down-bg); }

    .dot.warn { background: var(--warn); }

    .summary-line {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: 0 0 .55rem;
      margin-bottom: .45rem;
      border-bottom: 1px solid var(--border);
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
    }
    .summary-line .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .summary-line .status-dot.up   { background: var(--up);   box-shadow: 0 0 0 3px var(--up-bg); }
    .summary-line .status-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
    .summary-line .status-dot.down { background: var(--down); box-shadow: 0 0 0 3px var(--down-bg); }

    .pct.good { color: var(--up); }
    .pct.mid  { color: var(--warn); }
    .pct.bad  { color: var(--down); }

    .status-updated {
      font-size: .68rem;
      color: var(--muted);
      text-align: right;
      margin-top: .4rem;
      opacity: .8;
    }

    .dropdown-more {
      display: block;
      margin-top: .4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .74rem;
      color: var(--accent);
      text-decoration: none;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0   rgba(22, 163, 74, .4); }
      70%  { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0   rgba(22, 163, 74, 0); }
    }
    .api-hero {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
      animation: fade-up .45s ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .api-inner { max-width: 860px; width: 100%; }

    .api-group { margin-bottom: 2rem; }

    .api-group-heading { margin: 0 0 .8rem; }

    .api-group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      width: 100%;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0;
      border: none;
      background: none;
      appearance: none;
      font-family: inherit;
      cursor: pointer;
    }

    .api-group-chevron { width: 12px; height: 12px; flex-shrink: 0; transition: transform .15s ease; }
    .api-group.collapsed .api-group-chevron { transform: rotate(-90deg); }
    .api-group.collapsed .api-endpoints { display: none; }

    .api-endpoints {
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }

    .api-endpoint {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color .15s ease;
      overflow: hidden;
    }

    .api-endpoint:hover { border-color: var(--accent); }

    .api-endpoint-head {
      display: flex;
      align-items: center;
      gap: .7rem;
      flex-wrap: wrap;
      width: 100%;
      padding: 1.1rem 1.3rem;
      border: none;
      background: none;
      appearance: none;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .api-endpoint-head:focus-visible, .api-group-title:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .api-endpoint-summary {
      flex: 1 1 200px;
      min-width: 0;
      font-size: .8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .api-endpoint-chevron {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      color: var(--muted);
      transition: transform .15s ease;
    }

    .api-endpoint.expanded .api-endpoint-chevron { transform: rotate(180deg); }

    .api-endpoint-body { display: none; padding: 0 1.3rem 1.1rem; }
    .api-endpoint.expanded .api-endpoint-body { display: block; }

    .api-method {
      font-family: 'JetBrains Mono', monospace;
      font-size: .68rem;
      font-weight: 700;
      color: #fff;
      padding: .2rem .55rem;
      border-radius: 999px;
      letter-spacing: .03em;
      flex-shrink: 0;
    }

    .api-method.post { background: #8457e9; }
    .api-method.get { background: var(--accent-2); }
    .api-method.delete { background: var(--down); }
    .api-method.put, .api-method.patch { background: var(--warn); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .api-method { color: #1a1a22; }
      :root:not([data-theme="light"]) .api-method.post { background: var(--accent); }
    }
    :root[data-theme="dark"] .api-method { color: #1a1a22; }
    :root[data-theme="dark"] .api-method.post { background: var(--accent); }

    .api-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      font-weight: 600;
      word-break: break-all;
    }

    .api-detail-title {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: .8rem 0 .35rem;
    }

    .api-fields {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .76rem;
    }

    .api-field-name { color: var(--text); font-weight: 600; }
    .api-field-type { color: var(--accent-2); }
    .api-field-required { color: var(--down); font-size: .68rem; margin-left: .3rem; }

    .api-responses {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
    }

    .api-response-code {
      padding: .15rem .5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .api-status {
      font-size: .8rem;
      color: var(--muted);
      padding: 2rem 0;
      text-align: center;
    }

    .api-status.error { color: var(--down); }

    .api-try {
      margin-top: .9rem;
      padding-top: .9rem;
      border-top: 1px solid var(--border);
    }

    .api-try-fields {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      margin-bottom: .7rem;
    }

    .api-try-label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: .25rem;
    }

    .api-try-input {
      width: 100%;
      max-width: 360px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      padding: .4rem .55rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }

    .api-try-color { position: relative; }

    .api-try-color-btn {
      display: flex;
      align-items: center;
      gap: .5rem;
      max-width: 200px;
      height: 34px;
      padding: 0 .7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      transition: border-color .15s ease;
    }

    .api-try-color-btn:hover { border-color: var(--accent); }
    .api-try-color-btn svg { width: 10px; height: 10px; margin-left: auto; flex-shrink: 0; color: var(--muted); }

    .api-try-color-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .api-try-color-dropdown {
      position: fixed;
      min-width: 160px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px var(--shadow);
      padding: .4rem;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      z-index: 10;
    }

    .api-try-color.open .api-try-color-dropdown {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .api-try-color-option {
      display: flex;
      align-items: center;
      gap: .55rem;
      width: 100%;
      text-align: left;
      padding: .4rem .55rem;
      border-radius: 6px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .api-try-color-option:hover { background: rgba(139, 92, 246, .08); color: var(--accent); }
    .api-try-color-option.active { color: var(--accent); font-weight: 600; }

    .api-try-btn {
      font-size: .76rem;
      font-weight: 600;
      padding: .45rem 1rem;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #1a1a22;
      cursor: pointer;
      transition: opacity .15s ease;
    }

    .api-try-btn:disabled { opacity: .6; cursor: default; }

    .api-try-file {
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
    }

    .api-try-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .api-try-file-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: .76rem;
      font-weight: 600;
      padding: .4rem .85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s ease;
    }

    .api-try-file-btn:hover { border-color: var(--accent); }

    .api-try-file:has(.api-try-file-input:focus-visible) .api-try-file-btn {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .api-try-file-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: .76rem;
      color: var(--muted);
    }

    .api-try-response {
      display: none;
      margin-top: .7rem;
      padding: .7rem .85rem;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: .74rem;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .api-curl {
      margin-top: .9rem;
      padding-top: .9rem;
      border-top: 1px solid var(--border);
    }

    .api-curl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .35rem;
    }

    .api-curl-copy {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease;
    }
    .api-curl-copy:hover { color: var(--accent); border-color: var(--accent); }
    .api-curl-copy svg { width: 13px; height: 13px; }

    .api-curl-body {
      margin: 0;
      padding: .7rem .85rem;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: .74rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
    }

    .api-try-response.ok, .api-try-response.err { display: block; }
    .api-try-response.ok { border-color: var(--accent-2); }
    .api-try-response.err { border-color: var(--down); color: var(--down); }
    @media (max-width: 460px) {
      .bandeau-inner { justify-content: center; text-align: center; }
      .topnav { justify-content: center; gap: 1.2rem; }
      .footer-links { position: static; align-self: center; margin: 2rem 0 1.5rem; }
      .copyright { position: static; transform: none; text-align: center; margin: 0 0 1.5rem; }
      .status-nav { position: static; }
      .dropdown { left: 50%; right: auto; width: min(340px, calc(100vw - 2rem)); transform: translateX(-50%) translateY(-6px); }
      .dropdown.open, .status-nav:hover .dropdown { transform: translateX(-50%) translateY(0); }
      .lang-nav { position: static; }
      .lang-dropdown { left: 50%; right: auto; transform: translateX(-50%) translateY(-6px); }
      .lang-dropdown.open { transform: translateX(-50%) translateY(0); }
      .search-btn span { display: none; }
      .search-btn { padding: 0 .55rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

    function applyLanguage() {
      document.documentElement.lang = currentLang;
      document.title = t('title.api');
      const HTML_I18N_KEYS = new Set(['hero.title', 'wall.dropZone', 'projects.title', 'deploy.title']);
      document.querySelectorAll('[data-i18n]').forEach((el) => {

        if (HTML_I18N_KEYS.has(i18nKey)) {

        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
      });
      document.getElementById('lang-current').textContent = currentLang.toUpperCase();
      document.querySelectorAll('.lang-option').forEach((el) => {
        el.classList.toggle('active', el.getAttribute('data-lang') === currentLang);
      });

    applyLanguage();
    (function () {
    const langBtn = document.getElementById('lang-btn');
    const langDropdown = document.getElementById('lang-dropdown');

    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = langDropdown.classList.toggle('open');
      langBtn.setAttribute('aria-expanded', isOpen);
    });
    document.addEventListener('click', (e) => {
      if (!langDropdown.contains(e.target) && e.target !== langBtn) {
        langDropdown.classList.remove('open');
        langBtn.setAttribute('aria-expanded', 'false');
      }
    });
    const STATUS = 'https://status.khaddict.com';
    const SLUG   = 'khaddict';

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const dot      = document.getElementById('s-dot');
    const dropdown = document.getElementById('s-dropdown');
    const inner    = document.getElementById('s-inner');
    const btn      = document.getElementById('status-btn');

    let lastStatusFetch = null;
    function updateStatusFreshness() {
      const el = document.getElementById('status-updated');
      if (!el || !lastStatusFetch) return;
      const secs = Math.max(0, Math.round((Date.now() - lastStatusFetch) / 1000));
      el.textContent = t('status.updatedAgo').replace('{n}', secs);
    }
    setInterval(updateStatusFreshness, 5000);

    async function loadStatus() {
      const timeout = AbortSignal.timeout(8000);
      try {
        const [pageRes, hbRes] = await Promise.all([
          fetch(`${STATUS}/api/status-page/${SLUG}`, { signal: timeout }),
          fetch(`${STATUS}/api/status-page/heartbeat/${SLUG}`, { signal: timeout })
        ]);
        if (!pageRes.ok || !hbRes.ok) throw new Error();

        const page = await pageRes.json();
        const hb   = await hbRes.json();
        const monitors = page.publicGroupList.flatMap(g => g.monitorList);
        let up = 0;
        let anyRecentDown = false;

        const rows = monitors.map(m => {
          const beats = hb.heartbeatList[m.id] || [];
          const last  = beats[beats.length - 1];
          const isUp  = last?.status === 1;
          if (isUp) up++;

          const recent = beats.slice(-30);
          const recentHasDown = recent.some(b => b.status === 0);
          if (recentHasDown) anyRecentDown = true;

          const pct24 = hb.uptimeList[`${m.id}_24`];
          const pctNum = pct24 !== undefined ? pct24 * 100 : undefined;
          const p = pctNum !== undefined ? `${pctNum.toFixed(2)}%` : '—';
          const pctCls = !isUp ? 'bad' : recentHasDown ? 'mid' : 'good';
          const dotCls = !isUp ? 'down' : recentHasDown ? 'warn' : 'up';

          const bars = recent.map(b => {
            const state = b.status === 1 ? 'up' : b.status === 0 ? 'down' : b.status === 2 ? 'pending' : '';
            const title = b.time ? new Date(b.time).toLocaleString(currentLang === 'fr' ? 'fr-FR' : 'en-US', { hour: '2-digit', minute: '2-digit' }) : '';
            return `<span class="heartbeat-bar ${state}"${title ? ` title="${title}"` : ''}></span>`;
          }).join('');

          return `
            <div class="dropdown-line">
              <div class="dropdown-line-top">
                <span class="dot ${dotCls}"></span>
                <span class="dropdown-name">${escapeHtml(m.name)}</span>
                <span class="pct ${pctCls}">${p}</span>
              </div>
              <div class="heartbeat">${bars}</div>
            </div>`;
        }).join('');

        const total = monitors.length;
        let level, summaryKey;
        if (total > 0 && up === 0) { level = 'down'; summaryKey = 'status.majorOutage'; }
        else if (anyRecentDown) { level = 'warn'; summaryKey = 'status.partial'; }
        else { level = 'up'; summaryKey = 'status.allUp'; }

        inner.innerHTML = `
          <div class="summary-line"><span class="status-dot ${level}"></span>${t(summaryKey)}</div>
          ${rows}
          <a class="dropdown-more" href="${STATUS}" target="_blank" rel="noopener">${t('status.viewFull')}</a>
          <div class="status-updated" id="status-updated"></div>
        `;

        btn.classList.remove('warn-pill', 'down-pill');
        if (level === 'warn') btn.classList.add('warn-pill');
        if (level === 'down') btn.classList.add('down-pill');
        dot.className = `dot ${level}`;

        lastStatusFetch = Date.now();
        updateStatusFreshness();

      } catch {
        inner.innerHTML = `<div class="dropdown-line dropdown-msg">${t('status.unreachable')}</div>`;
      }
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = dropdown.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen);

        btn.setAttribute('aria-expanded', 'false');

    loadStatus();

    document.getElementById('theme-toggle').addEventListener('click', () => {

    function flashCopyState(btn, toast, ms) {
      btn.classList.add('copied');
      toast.classList.add('show');
      clearTimeout(btn.__copyFlashTimer);
      btn.__copyFlashTimer = setTimeout(() => {
        toast.classList.remove('show');
        btn.classList.remove('copied');
      }, ms || 900);
    }
    (function () {
      const discordBtn = document.getElementById('discord-btn');
      const discordToast = document.getElementById('discord-toast');

      discordBtn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText('khaddict'); } catch {}
        flashCopyState(discordBtn, discordToast);
      });
    })();

    (function () {
      const API_BASE_URL = 'https://api.khaddict.com';
      const statusEl = document.getElementById('api-status');
      const groupsEl = document.getElementById('api-groups');
      const METHOD_ORDER = ['post', 'get', 'put', 'patch', 'delete'];
      const GROUP_ORDER = ['BUSY Bar', 'System'];

      const endpointMeta = new Map();

      const WALL_COLORS = [
        { name: 'White', hex: '#FFFFFF' },
        { name: 'Red', hex: '#FF0000' },
        { name: 'Orange', hex: '#FF8800' },
        { name: 'Yellow', hex: '#FFFF00' },
        { name: 'Green', hex: '#00FF00' },
        { name: 'Cyan', hex: '#00FFFF' },
        { name: 'Blue', hex: '#0066FF' },
        { name: 'Magenta', hex: '#FF00FF' },
      ];

      function resolveSchema(spec, schema) {
        if (!schema) return null;
        if (schema.$ref) {
          const name = schema.$ref.split('/').pop();
          return (spec.components && spec.components.schemas && spec.components.schemas[name]) || null;
        }
        return schema;
      }

      function requiresBearerAuth(spec, operation) {
        const schemes = (spec.components && spec.components.securitySchemes) || {};
        return (operation.security || []).some((req) =>
          Object.keys(req).some((name) => {
            const scheme = schemes[name];
            return scheme && scheme.type === 'http' && scheme.scheme === 'bearer';
          })
        );
      }

      function schemaTypeLabel(prop) {
        if (!prop) return 'any';
        if (prop.type === 'array') return `${(prop.items && prop.items.type) || 'any'}[]`;
        return prop.type || 'any';
      }

      function renderRequestFields(spec, operation) {
        const body = operation.requestBody;
        if (!body || !body.content) return '';
        const media = body.content['application/json'] || body.content['multipart/form-data'];
        if (!media) return '';
        const schema = resolveSchema(spec, media.schema);
        if (!schema || !schema.properties) return '';
        const required = new Set(schema.required || []);
        const rows = Object.entries(schema.properties).map(([name, prop]) => `
          <div>
            <span class="api-field-name">${escapeHtml(name)}</span>
            <span class="api-field-type">${escapeHtml(schemaTypeLabel(prop))}</span>
            ${required.has(name) ? `<span class="api-field-required">${t('api.required')}</span>` : ''}
          </div>
        `).join('');
        return `<div class="api-detail-title">${t('api.body')}</div><div class="api-fields">${rows}</div>`;
      }

      function renderParams(operation) {
        const params = operation.parameters;
        if (!params || !params.length) return '';
        const rows = params.map((p) => `
          <div>
            <span class="api-field-name">${escapeHtml(p.name)}</span>
            <span class="api-field-type">${escapeHtml(schemaTypeLabel(p.schema))} · ${escapeHtml(p.in)}</span>
            ${p.required ? `<span class="api-field-required">${t('api.required')}</span>` : ''}
          </div>
        `).join('');
        return `<div class="api-detail-title">${t('api.params')}</div><div class="api-fields">${rows}</div>`;
      }

      function renderResponses(operation) {
        const responses = operation.responses;
        if (!responses) return '';
        const chips = Object.keys(responses).map((code) => `<span class="api-response-code">${code}</span>`).join('');
        return `<div class="api-detail-title">${t('api.responses')}</div><div class="api-responses">${chips}</div>`;
      }

      function exampleFieldValue(name, prop) {
        if (name === 'color' && prop && prop.default) return prop.default;
        if (name === 'slug') return 'my-blog-post-slug';
        if (name === 'status') return 'firing';
        if (name === 'groupLabels') return { alertname: 'HostOutOfDisk' };
        if (name === 'alerts') {
          return [{ labels: { alertname: 'HostOutOfDisk', instance: 'server.example.com', severity: 'critical' } }];
        }
        if (prop && prop.type === 'object') return {};
        if (prop && prop.type === 'array') return [];
        if (prop && (prop.type === 'integer' || prop.type === 'number')) return 0;
        if (prop && prop.type === 'boolean') return true;
        return 'Hello!';
      }

      function curlLiveToken(container) {
        const el = container && container.querySelector('[data-auth="bearer"]');
        return (el && el.value) || undefined;
      }

      function curlLiveValue(container, name) {
        if (!container) return undefined;
        const el = container.querySelector(`[data-field="${name}"], [data-param="${name}"]`);
        if (!el) return undefined;
        if (el.classList.contains('api-try-color')) return el.dataset.value || undefined;
        if (el.type === 'file') return el.files[0] ? el.files[0].name : undefined;
        return el.value !== '' ? el.value : undefined;
      }

      function renderCurlExample(spec, path, method, operation, container) {
        const params = operation.parameters || [];
        const body = operation.requestBody;
        let bodyKind = '';
        let bodySchema = null;
        if (body && body.content) {
          if (body.content['application/json']) {
            bodyKind = 'json';
            bodySchema = resolveSchema(spec, body.content['application/json'].schema);
          } else if (body.content['multipart/form-data']) {
            bodyKind = 'multipart';
            bodySchema = resolveSchema(spec, body.content['multipart/form-data'].schema);
          }
        }

        let resolvedPath = path;
        params.filter((p) => p.in === 'path').forEach((p) => {
          const value = curlLiveValue(container, p.name) ?? exampleFieldValue(p.name, p.schema);
          resolvedPath = resolvedPath.replace(`{${p.name}}`, value);
        });

        let url = `${API_BASE_URL}${resolvedPath}`;
        const queryParams = params.filter((p) => p.in === 'query');
        if (queryParams.length) {
          url += '?' + queryParams.map((p) => `${p.name}=${curlLiveValue(container, p.name) ?? exampleFieldValue(p.name, p.schema)}`).join('&');
        }

        const lines = [`curl -X ${method.toUpperCase()} '${url}'`];

        if (requiresBearerAuth(spec, operation)) {
          lines.push(`  -H 'Authorization: Bearer ${curlLiveToken(container) || 'YOUR_TOKEN'}'`);
        }

        if (bodyKind === 'json' && bodySchema && bodySchema.properties) {
          const payload = {};
          Object.entries(bodySchema.properties).forEach(([name, prop]) => {
            const live = curlLiveValue(container, name);
            payload[name] = live !== undefined
              ? ((prop.type === 'integer' || prop.type === 'number') ? Number(live) : live)
              : exampleFieldValue(name, prop);
          });
          lines.push(`  -H 'Content-Type: application/json'`);
          lines.push(`  -d '${JSON.stringify(payload)}'`);
        } else if (bodyKind === 'multipart' && bodySchema && bodySchema.properties) {
          Object.entries(bodySchema.properties).forEach(([name, prop]) => {
            if (prop.format === 'binary' || prop.contentMediaType) {
              const filename = curlLiveValue(container, name);
              const placeholderName = path.includes('audio') ? 'recording.wav' : 'file.png';
              lines.push(`  -F '${name}=@${filename || '/path/to/' + placeholderName}'`);
            } else {
              lines.push(`  -F '${name}=${curlLiveValue(container, name) ?? exampleFieldValue(name, prop)}'`);
            }
          });
        }

        return lines.join(' \\\n');
      }

      function fieldInputHtml(fieldId, name, prop, required, attr = 'field', path = '') {
        const safeName = escapeHtml(name);
        if (name === 'color') {
          const selected = (prop && WALL_COLORS.find((c) => c.hex === prop.default)) || WALL_COLORS[0];
          const options = WALL_COLORS.map((c) => `
            <button type="button" class="api-try-color-option${c.hex === selected.hex ? ' active' : ''}" data-value="${c.hex}">
              <span class="api-try-color-swatch" style="background:${c.hex}"></span>
              <span class="api-try-color-option-label">${c.name}</span>
            </button>
          `).join('');
          return `
            <div class="api-try-color" id="${fieldId}" data-${attr}="${safeName}" data-value="${selected.hex}">
              <button type="button" class="api-try-color-btn" aria-haspopup="true" aria-expanded="false">
                <span class="api-try-color-swatch" style="background:${selected.hex}"></span>
                <span class="api-try-color-label">${selected.name}</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="api-try-color-dropdown">${options}</div>
            </div>
          `;
        }
        if (prop && (prop.format === 'binary' || prop.contentMediaType)) {
          const accept = path.includes('audio') ? 'audio/*' : 'image/png,image/jpeg,image/webp';
          return `
            <div class="api-try-file">
              <label class="api-try-file-btn" for="${fieldId}">${t('api.chooseFile')}</label>
              <span class="api-try-file-name" id="${fieldId}-name">${t('api.noFileChosen')}</span>
              <input class="api-try-file-input" id="${fieldId}" data-${attr}="${safeName}" type="file" accept="${accept}" ${required ? 'required' : ''} />
            </div>
          `;
        }
        if (prop && (prop.type === 'integer' || prop.type === 'number')) {
          return `<input class="api-try-input" id="${fieldId}" data-${attr}="${safeName}" type="number" ${required ? 'required' : ''} />`;
        }
        const maxLength = prop && prop.maxLength ? `maxlength="${prop.maxLength}"` : '';
        const placeholder = prop && (prop.type === 'object' || prop.type === 'array')
          ? ` placeholder="${escapeHtml(JSON.stringify(exampleFieldValue(name, prop)))}"`
          : '';
        return `<input class="api-try-input" id="${fieldId}" data-${attr}="${safeName}" type="text" ${maxLength}${placeholder} ${required ? 'required' : ''} />`;
      }

      function renderTryForm(spec, path, method, operation, formId) {
        const params = operation.parameters || [];
        const body = operation.requestBody;
        let bodyKind = '';
        let bodySchema = null;
        if (body && body.content) {
          if (body.content['application/json']) {
            bodyKind = 'json';
            bodySchema = resolveSchema(spec, body.content['application/json'].schema);
          } else if (body.content['multipart/form-data']) {
            bodyKind = 'multipart';
            bodySchema = resolveSchema(spec, body.content['multipart/form-data'].schema);
          }
        }

        const required = new Set((bodySchema && bodySchema.required) || []);
        const bodyFields = bodySchema && bodySchema.properties
          ? Object.entries(bodySchema.properties).map(([name, prop]) => {
              const fieldId = `${formId}-${escapeHtml(name)}`;
              return `
                <div>
                  <label class="api-try-label" for="${fieldId}">${escapeHtml(name)}</label>
                  ${fieldInputHtml(fieldId, name, prop, required.has(name), 'field', path)}
                </div>
              `;
            }).join('')
          : '';

        const paramFields = params.map((p) => {
          const fieldId = `${formId}-${escapeHtml(p.name)}`;
          return `
            <div>
              <label class="api-try-label" for="${fieldId}">${escapeHtml(p.name)} · ${escapeHtml(p.in)}</label>
              ${fieldInputHtml(fieldId, p.name, p.schema, p.required, 'param')}
            </div>
          `;
        }).join('');

        const authField = requiresBearerAuth(spec, operation) ? `
          <div>
            <label class="api-try-label" for="${formId}-token">${t('api.authToken')}</label>
            <input class="api-try-input" id="${formId}-token" data-auth="bearer" type="password" />
          </div>
        ` : '';

        return `
          <div class="api-try" id="${formId}" data-path="${path}" data-method="${method}" data-body-kind="${bodyKind}">
            ${(authField || bodyFields || paramFields) ? `<div class="api-try-fields">${authField}${paramFields}${bodyFields}</div>` : ''}
            <button type="button" class="api-try-btn" data-action="execute">${t('api.execute')}</button>
            <pre class="api-try-response"></pre>
          </div>
        `;
      }

      function apiEndpointSlug(method, path) {
        const cleanPath = path.replace(/[{}]/g, '').replace(/^\/+|\/+$/g, '').replace(/\//g, '-');
        return `endpoint-${method.toLowerCase()}-${cleanPath}`;
      }
      function endpointHtml(spec, path, method, operation, index) {
        const summary = operation.summary || operation.description || '';
        const curlExample = renderCurlExample(spec, path, method, operation);
        return `
          <article class="api-endpoint" id="${apiEndpointSlug(method, path)}">
            <button type="button" class="api-endpoint-head" aria-expanded="false">
              <span class="api-method ${method}">${method.toUpperCase()}</span>
              <code class="api-path">${escapeHtml(path)}</code>
              ${summary ? `<span class="api-endpoint-summary">${escapeHtml(summary)}</span>` : ''}
              <svg class="api-endpoint-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="api-endpoint-body">
              ${renderParams(operation)}
              ${renderRequestFields(spec, operation)}
              ${renderResponses(operation)}
              ${renderTryForm(spec, path, method, operation, `ep-${index}`)}
              <div class="api-curl">
                <div class="api-curl-head">
                  <span class="api-detail-title">curl</span>
                  <button type="button" class="api-curl-copy" data-action="copy-curl" aria-label="${t('discord.toast')}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span class="copy-toast">${t('discord.toast')}</span>
                  </button>
                </div>
                <pre class="api-curl-body">${escapeHtml(curlExample)}</pre>
              </div>
            </div>
          </article>
        `;
      }

      async function loadSpec() {
        try {
          const res = await fetch(`${API_BASE_URL}/openapi.json`);
          if (!res.ok) throw new Error('bad response');
          const spec = await res.json();

          const groups = new Map();
          let epIndex = 0;
          Object.entries(spec.paths || {}).forEach(([path, methods]) => {
            METHOD_ORDER.forEach((method) => {
              const operation = methods[method];
              if (!operation) return;
              const tag = (operation.tags && operation.tags[0]) || 'Other';
              if (!groups.has(tag)) groups.set(tag, []);
              const index = epIndex++;
              groups.get(tag).push({ path, method, operation, index });
              endpointMeta.set(index, { spec, path, method, operation });
            });
          });

          const orderedTags = [
            ...GROUP_ORDER.filter((tag) => groups.has(tag)),
            ...[...groups.keys()].filter((tag) => !GROUP_ORDER.includes(tag)),
          ];

          groupsEl.innerHTML = orderedTags.map((tag) => `
            <section class="api-group">
              <h2 class="api-group-heading">
                <button type="button" class="api-group-title" aria-expanded="true">
                  ${escapeHtml(tag)}
                  <svg class="api-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
              </h2>
              <div class="api-endpoints">
                ${groups.get(tag).map((e) => endpointHtml(spec, e.path, e.method, e.operation, e.index)).join('')}
              </div>
            </section>
          `).join('');

          statusEl.style.display = 'none';

          if (location.hash) {
            const target = document.getElementById(location.hash.slice(1));
            if (target) {
              target.querySelector('.api-endpoint-head').click();
              target.scrollIntoView({ block: 'start' });
            }
          }
        } catch {
          statusEl.textContent = t('api.error');
          statusEl.classList.add('error');
        }
      }

      function fieldValue(el) {
        if (el.classList.contains('api-try-color')) return el.dataset.value;
        return el.value;
      }

      function refreshCurlExample(tryForm) {
        const meta = endpointMeta.get(Number(tryForm.id.slice(3)));
        const curlBody = tryForm.closest('.api-endpoint').querySelector('.api-curl-body');
        if (!meta || !curlBody) return;
        curlBody.textContent = renderCurlExample(meta.spec, meta.path, meta.method, meta.operation, tryForm);
      }

      groupsEl.addEventListener('input', (e) => {
        const tryForm = e.target.closest('.api-try');
        if (tryForm) refreshCurlExample(tryForm);
      });

      groupsEl.addEventListener('change', (e) => {
        const input = e.target.closest('input[type="file"][data-field], input[type="file"][data-param]');
        if (!input) return;
        const nameEl = document.getElementById(`${input.id}-name`);
        if (nameEl) nameEl.textContent = input.files[0] ? input.files[0].name : t('api.noFileChosen');
        refreshCurlExample(input.closest('.api-try'));
      });

      groupsEl.addEventListener('click', (e) => {
        const groupTitle = e.target.closest('.api-group-title');
        if (groupTitle) {
          const group = groupTitle.closest('.api-group');
          const collapsed = group.classList.toggle('collapsed');
          groupTitle.setAttribute('aria-expanded', !collapsed);
          return;
        }
        const head = e.target.closest('.api-endpoint-head');
        if (head) {
          const endpoint = head.closest('.api-endpoint');
          const expanded = endpoint.classList.toggle('expanded');
          head.setAttribute('aria-expanded', expanded);
        }
      });

      groupsEl.addEventListener('click', (e) => {
        const option = e.target.closest('.api-try-color-option');
        if (option) {
          const wrapper = option.closest('.api-try-color');
          wrapper.dataset.value = option.dataset.value;
          wrapper.querySelector('.api-try-color-btn .api-try-color-swatch').style.background = option.dataset.value;
          wrapper.querySelector('.api-try-color-btn .api-try-color-label').textContent = option.querySelector('.api-try-color-option-label').textContent;
          wrapper.querySelectorAll('.api-try-color-option').forEach((o) => o.classList.toggle('active', o === option));
          wrapper.classList.remove('open');
          refreshCurlExample(wrapper.closest('.api-try'));
          return;
        }
        const trigger = e.target.closest('.api-try-color-btn');
        if (trigger) {
          const wrapper = trigger.closest('.api-try-color');
          const isOpen = wrapper.classList.toggle('open');
          trigger.setAttribute('aria-expanded', isOpen);
          if (isOpen) {
            const dropdown = wrapper.querySelector('.api-try-color-dropdown');
            const rect = trigger.getBoundingClientRect();
            const dropdownHeight = dropdown.offsetHeight;
            const spaceBelow = window.innerHeight - rect.bottom;
            const openUpward = spaceBelow < dropdownHeight + 6 && rect.top > dropdownHeight + 6;
            dropdown.style.top = openUpward
              ? `${rect.top - dropdownHeight - 6}px`
              : `${rect.bottom + 6}px`;
            dropdown.style.left = `${rect.left}px`;
          }
        }
      });

      function closeAllColorDropdowns() {
        groupsEl.querySelectorAll('.api-try-color.open').forEach((wrapper) => {
          wrapper.classList.remove('open');
          wrapper.querySelector('.api-try-color-btn').setAttribute('aria-expanded', 'false');
        });
      }

      document.addEventListener('click', (e) => {
        groupsEl.querySelectorAll('.api-try-color.open').forEach((wrapper) => {
          if (wrapper.contains(e.target)) return;
          wrapper.classList.remove('open');
          wrapper.querySelector('.api-try-color-btn').setAttribute('aria-expanded', 'false');
        });
      });

      window.addEventListener('scroll', closeAllColorDropdowns, true);
      window.addEventListener('resize', closeAllColorDropdowns);

      groupsEl.addEventListener('click', async (e) => {
        const copyBtn = e.target.closest('[data-action="copy-curl"]');
        if (!copyBtn) return;
        const body = copyBtn.closest('.api-curl').querySelector('.api-curl-body');
        try { await navigator.clipboard.writeText(body.textContent); } catch {}
        flashCopyState(copyBtn, copyBtn.querySelector('.copy-toast'));
      });

      groupsEl.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action="execute"]');
        if (!btn) return;
        const container = btn.closest('.api-try');
        const responseEl = container.querySelector('.api-try-response');
        const method = container.dataset.method;
        const bodyKind = container.dataset.bodyKind;
        const inputs = container.querySelectorAll('[data-field]');

        let path = container.dataset.path;
        container.querySelectorAll('[data-param]').forEach((el) => {
          path = path.replace(`{${el.dataset.param}}`, encodeURIComponent(fieldValue(el)));
        });

        const meta = endpointMeta.get(Number(container.id.slice(3)));
        const bodySchema = meta
          ? resolveSchema(meta.spec, meta.operation.requestBody?.content?.['application/json']?.schema)
          : null;

        const opts = { method: method.toUpperCase() };
        if (bodyKind === 'json') {
          const payload = {};
          inputs.forEach((el) => {
            const prop = bodySchema && bodySchema.properties && bodySchema.properties[el.dataset.field];
            let value = el.type === 'number' ? Number(el.value) : fieldValue(el);
            if (prop && (prop.type === 'object' || prop.type === 'array') && typeof value === 'string') {
              try { value = JSON.parse(value); } catch {}
            }
            payload[el.dataset.field] = value;
          });
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify(payload);
        } else if (bodyKind === 'multipart') {
          const fd = new FormData();
          inputs.forEach((el) => {
            if (el.type === 'file') {
              if (el.files[0]) fd.append(el.dataset.field, el.files[0]);
            } else {
              fd.append(el.dataset.field, fieldValue(el));
            }
          });
          opts.body = fd;
        }

        const token = curlLiveToken(container);
        if (token) opts.headers = { ...opts.headers, Authorization: `Bearer ${token}` };

        btn.disabled = true;
        const originalLabel = btn.textContent;
        btn.textContent = t('api.sending');
        responseEl.textContent = '';
        responseEl.className = 'api-try-response';

        try {
          const res = await fetch(`${API_BASE_URL}${path}`, opts);
          const raw = await res.text();
          let bodyText = raw;
          try { bodyText = JSON.stringify(JSON.parse(raw), null, 2); } catch {}
          responseEl.textContent = `${res.status} ${res.statusText}` + (bodyText ? `\n\n${bodyText}` : '');
          responseEl.classList.add(res.ok ? 'ok' : 'err');
        } catch (err) {
          responseEl.textContent = `${t('api.networkError')}: ${err.message}`;
          responseEl.classList.add('err');
        } finally {
          btn.disabled = false;
          btn.textContent = originalLabel;
        }
      });

      loadSpec();
    })();
  </script>

    const CMDK_API_BASE_URL = 'https://api.khaddict.com';

    (function () {
      const overlay = document.getElementById('cmdk-overlay');
      const input = document.getElementById('cmdk-input');
      const results = document.getElementById('cmdk-results');
      const kbd = document.getElementById('cmdk-kbd');
      let items = [];
      let activeIndex = 0;
      let apiEndpoints = [];
      let apiEndpointsPromise = null;

      function loadApiEndpoints() {
        if (apiEndpointsPromise) return apiEndpointsPromise;
        apiEndpointsPromise = (async () => {
          try {
            const res = await fetch(`${CMDK_API_BASE_URL}/openapi.json`);
            const spec = await res.json();
            const methodOrder = ['get', 'post', 'put', 'patch', 'delete'];
            Object.entries(spec.paths || {}).forEach(([path, methods]) => {
              methodOrder.forEach((method) => {
                const operation = methods[method];
                if (!operation) return;
                apiEndpoints.push({
                  method,
                  path,
                  summary: operation.summary || operation.description || '',
                  href: `${CMDK_API_HREF}#${apiEndpointSlug(method, path)}`,
                });
              });
            });
            render(input.value);
          } catch {
            apiEndpointsPromise = null;
          }
        })();
        return apiEndpointsPromise;
      }

      const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
      const isApple = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
      if (isTouchDevice) {
        kbd.style.display = 'none';
      } else {
        kbd.textContent = isApple ? '⌘K' : 'Ctrl K';
      }

      function open() {
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        input.value = '';
        render('');
        setTimeout(() => input.focus(), 0);
        loadApiEndpoints();
      }

      function close() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      function render(query) {
        const q = query.trim().toLowerCase();
        const nav = q === '' ? [] : CMDK_NAV.filter((n) => n.label.toLowerCase().includes(q));
        const posts = q === '' ? CMDK_POSTS.slice(0, 3) : CMDK_POSTS.filter((p) => {
          const title = currentLang === 'fr' ? p.titleFr : p.title;
          const excerpt = currentLang === 'fr' ? p.excerptFr : p.excerpt;
          return (title + ' ' + excerpt).toLowerCase().includes(q);
        });
        const api = q === '' ? apiEndpoints.slice(0, 3) : apiEndpoints.filter((e) => {
          return (e.method + ' ' + e.path + ' ' + e.summary).toLowerCase().includes(q);
        });
        const media = q === '' ? CMDK_MEDIA.slice(0, 3) : CMDK_MEDIA.filter((m) => m.name.toLowerCase().includes(q));

        items = [
          ...nav.map((n) => ({ type: 'nav', label: n.label, href: n.href })),
          ...posts.map((p) => ({ type: 'post', label: currentLang === 'fr' ? p.titleFr : p.title, excerpt: currentLang === 'fr' ? p.excerptFr : p.excerpt, href: p.href })),
          ...api.map((e) => ({ type: 'api', label: `${e.method.toUpperCase()} ${e.path}`, excerpt: e.summary, href: e.href })),
          ...media.map((m) => ({ type: 'media', label: m.name, href: m.href })),
        ];
        activeIndex = 0;

        if (items.length === 0) {
          results.innerHTML = `<div class="cmdk-empty">${t('search.empty')}</div>`;
          return;
        }

        let html = '';
        if (nav.length > 0) html += `<div class="cmdk-group-label">${t('search.groupNav')}</div>`;
        items.forEach((item, i) => {
          if (item.type === 'post' && i === nav.length) html += `<div class="cmdk-group-label">${t('search.groupPosts')}</div>`;
          if (item.type === 'api' && i === nav.length + posts.length) html += `<div class="cmdk-group-label">${t('search.groupApi')}</div>`;
          if (item.type === 'media' && i === nav.length + posts.length + api.length) html += `<div class="cmdk-group-label">${t('search.groupMedia')}</div>`;
          html += `
            <a class="cmdk-item${i === activeIndex ? ' active' : ''}" data-index="${i}" href="${escapeHtml(item.href)}">
              <span class="cmdk-item-title">${escapeHtml(item.label)}</span>
              ${item.excerpt ? `<span class="cmdk-item-excerpt">${escapeHtml(item.excerpt)}</span>` : ''}
            </a>
          `;
        });
        results.innerHTML = html;
      }

      function setActive(index) {
        const nodes = results.querySelectorAll('.cmdk-item');
        if (nodes.length === 0) return;
        activeIndex = (index + nodes.length) % nodes.length;
        nodes.forEach((n, i) => n.classList.toggle('active', i === activeIndex));
        nodes[activeIndex].scrollIntoView({ block: 'nearest' });
      }

      document.getElementById('cmdk-btn').addEventListener('click', open);
      document.getElementById('search-cta-btn')?.addEventListener('click', open);

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          const focused = document.activeElement;
          const isTyping = focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA' || focused.isContentEditable);
          if (isTyping && focused !== input) return;
          e.preventDefault();
          overlay.classList.contains('open') ? close() : open();
          return;
        }
        if (!overlay.classList.contains('open')) return;
        if (e.key === 'Escape') { close(); return; }
        if (e.key === 'Tab') {
          const focusable = [input, ...results.querySelectorAll('.cmdk-item')];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
          return;
        }
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); return; }
        if (e.key === 'Enter') {
          e.preventDefault();
          const active = items[activeIndex];
          if (active) window.location.href = active.href;
        }
      });

      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      input.addEventListener('input', () => render(input.value));
    })();
  </script>
  </div></body>
</html>
