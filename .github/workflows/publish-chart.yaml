name: Publish khaddict-com chart

on:
  push:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "files/**"
      - "templates/**"
      - "build.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: bump-voidnode-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Render templates
        run: python build.py

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "v4.2.4"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        id: version
        run: |
          VERSION="0.1.$(git rev-list --count HEAD)"
          helm package . --version "$VERSION" --app-version "$VERSION" -d /tmp/chart-out
          helm push "/tmp/chart-out/khaddict-com-${VERSION}.tgz" oci://ghcr.io/khaddict/charts
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  bump-voidnode:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout voidnode
        uses: ./.github/actions/checkout-voidnode
        with:
          token: ${{ secrets.VOIDNODE_REPO_TOKEN }}

      - name: Bump khaddict-com chart version in voidnode
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          python3 -c "
          import re, os
          path = 'voidnode/argocd/apps/khaddict/Chart.yaml'
          version = os.environ['VERSION']
          content = open(path).read()
          updated = re.sub(r'(name: khaddict-com\n\s+version: \")[^\"]+(\")', rf'\g<1>{version}\g<2>', content, count=1)
          if updated == content:
              raise SystemExit('khaddict-com version pattern not found in Chart.yaml, refusing to commit a no-op change')
          open(path, 'w').write(updated)
          "

      - name: Open PR against voidnode
        uses: ./.github/actions/open-pr-against-voidnode
        with:
          github-token: ${{ secrets.VOIDNODE_REPO_TOKEN }}
          files: argocd/apps/khaddict/Chart.yaml
          branch: bump-khaddict-com-chart-${{ needs.publish.outputs.version }}
          commit-message: Update khaddict-com chart to ${{ needs.publish.outputs.version }}
          pr-title: Update khaddict-com chart to ${{ needs.publish.outputs.version }}
          pr-body: Automated bump from khaddict-com's publish-chart.yaml CI, triggered by ${{ github.sha }}.
