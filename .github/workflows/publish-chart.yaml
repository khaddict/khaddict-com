name: Publish khaddict-com chart

on:
  push:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "files/**"
      - "templates/**"
      - "build.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Render templates
        run: python build.py

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v4.2.4"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        id: version
        run: |
          VERSION="0.1.$(git rev-list --count HEAD)"
          helm package . --version "$VERSION" --app-version "$VERSION" -d /tmp/chart-out
          helm push "/tmp/chart-out/khaddict-com-${VERSION}.tgz" oci://ghcr.io/khaddict/charts
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  bump-voidnode:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout voidnode
        uses: actions/checkout@v7.0.1
        with:
          repository: khaddict/voidnode
          token: ${{ secrets.VOIDNODE_REPO_TOKEN }}
          path: voidnode

      - name: Bump khaddict-com chart version in voidnode
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          python3 -c "
          import re, os
          path = 'voidnode/argocd/apps/khaddict/Chart.yaml'
          version = os.environ['VERSION']
          content = open(path).read()
          updated = re.sub(r'(name: khaddict-com\n\s+version: \")[^\"]+(\")', rf'\g<1>{version}\g<2>', content, count=1)
          if updated == content:
              raise SystemExit('khaddict-com version pattern not found in Chart.yaml, refusing to commit a no-op change')
          open(path, 'w').write(updated)
          "

      - name: Open PR against voidnode
        working-directory: voidnode
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          GH_TOKEN: ${{ secrets.VOIDNODE_REPO_TOKEN }}
        run: |
          git config user.name "khaddict-com-ci"
          git config user.email "ci@khaddict.com"
          git add argocd/apps/khaddict/Chart.yaml
          if git diff --cached --quiet; then
            echo "No change, skipping"
            exit 0
          fi
          BRANCH="bump-khaddict-com-chart-$VERSION"
          git checkout -b "$BRANCH"
          git commit -m "Update khaddict-com chart to $VERSION"
          git push -f origin "$BRANCH"
          gh pr create \
            --title "Update khaddict-com chart to $VERSION" \
            --body "Automated bump from khaddict-com's publish-chart.yaml CI, triggered by ${{ github.sha }}." \
            --base main \
            --head "$BRANCH" \
            || echo "PR for $BRANCH may already exist, skipping"
