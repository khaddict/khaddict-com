name: Build media-khaddict

on:
  push:
    branches: [main]
    paths:
      - "media-build/media/**"
      - "media-build/Dockerfile"
      - "media-build/process-icons.sh"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: echo "value=0.1.$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: media-build
          push: true
          tags: |
            ghcr.io/khaddict/media-khaddict:${{ steps.sha.outputs.short }}
            ghcr.io/khaddict/media-khaddict:${{ steps.version.outputs.value }}

  bump-voidnode:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout voidnode
        uses: ./.github/actions/checkout-voidnode
        with:
          token: ${{ secrets.VOIDNODE_REPO_TOKEN }}

      - name: Bump media-khaddict tag in voidnode
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 -c "
          import re, os
          version = os.environ['VERSION']

          # argocd/apps/khaddict/values.yaml: repository: / tag: \"x\" on separate lines
          path = 'voidnode/argocd/apps/khaddict/values.yaml'
          content = open(path).read()
          updated = re.sub(
              r'(repository: ghcr\.io/khaddict/media-khaddict\n\s+tag: \")[^\"]+(\")',
              rf'\g<1>{version}\g<2>',
              content,
              count=1,
          )
          if updated == content:
              raise SystemExit(f'media-khaddict tag pattern not found in {path}, refusing to commit a no-op change')
          open(path, 'w').write(updated)

          # saltmaster local-dev compose: inline image: repo:tag
          path = 'voidnode/role/saltmaster/files/website-dev/docker-compose.yml'
          content = open(path).read()
          updated = re.sub(
              r'(ghcr\.io/khaddict/media-khaddict:)[^\"\s]+',
              rf'\g<1>{version}',
              content,
              count=1,
          )
          if updated == content:
              raise SystemExit(f'media-khaddict tag pattern not found in {path}, refusing to commit a no-op change')
          open(path, 'w').write(updated)
          "

      - name: Open PR against voidnode
        uses: ./.github/actions/open-pr-against-voidnode
        with:
          github-token: ${{ secrets.VOIDNODE_REPO_TOKEN }}
          files: argocd/apps/khaddict/values.yaml role/saltmaster/files/website-dev/docker-compose.yml
          branch: bump-media-khaddict-${{ needs.build.outputs.version }}
          commit-message: Update ghcr.io/khaddict/media-khaddict Docker tag to v${{ needs.build.outputs.version }}
          pr-title: Update ghcr.io/khaddict/media-khaddict Docker tag to v${{ needs.build.outputs.version }}
          pr-body: >-
            Automated bump from khaddict-com's media-khaddict.yaml CI, triggered by ${{ github.sha }}.
            Bumps both the production chart and the saltmaster local-dev preview to keep them in sync.
