name: Check templates render

on:
  pull_request:
    paths:
      - "templates/**"
      - "build.py"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "build.py"
      - "requirements.txt"

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check en/fr i18n key parity
        run: |
          python3 -c "
          import sys, yaml, pathlib
          failed = False
          for f in sorted(pathlib.Path('templates/data/i18n').glob('*.yaml')):
              data = yaml.safe_load(f.read_text())
              en, fr = set(data.get('en', {})), set(data.get('fr', {}))
              if en != fr:
                  failed = True
                  print(f'{f.name}: en-only={en - fr} fr-only={fr - en}')
          sys.exit(1 if failed else 0)
          "

      - name: Render templates
        run: python build.py

      - name: Check committed generated artifacts are up to date
        run: git diff --exit-code -- files/api vps-fallback/index.html
